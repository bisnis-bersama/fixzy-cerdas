<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#081326">
<title>ABSENSI KARYAWAN</title>
<style>
*{box-sizing:border-box} :root{--navy:#081326;--navy2:#101d33;--yellow:#ffc107;--bg:#f2f5f9;--line:#dbe3ed;--text:#172033;--muted:#64748b;--green:#16a34a;--red:#dc2626}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}button,input,select{font:inherit}button{cursor:pointer}
.header{position:sticky;top:0;z-index:30;background:var(--navy);color:#fff;min-height:74px;padding:9px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 4px 16px #0004}.logo{width:52px;height:52px;object-fit:contain;border-radius:10px;flex:none}.brand{flex:1;min-width:0}.brand h1{font-size:18px;margin:0;font-weight:900}.brand p{font-size:11px;color:#cbd5e1;margin:3px 0 0}.owner{text-align:right;max-width:250px;overflow:hidden}.owner b,.owner span{display:block;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}.owner b{font-size:12px}.owner span{font-size:10px;color:#cbd5e1;margin-top:3px}.refresh{height:44px;width:44px;border:0;border-radius:12px;background:var(--yellow);font-weight:900;font-size:20px}
.wrap{max-width:1250px;margin:auto;padding:12px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 4px 16px #0000000a}.status{font-size:12px;color:var(--muted);line-height:1.5}.ok{color:#15803d;font-weight:800}.err{color:#b91c1c;font-weight:800}.page-nav{display:flex;gap:8px;overflow:auto;margin-bottom:12px}.page-nav a{flex:1;min-width:130px;text-decoration:none;text-align:center;padding:10px 8px;border-radius:11px;background:#e2e8f0;color:#172033;font-size:11px;font-weight:900}.page-nav a.active{background:var(--yellow);color:#111}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:5px}label{font-size:11px;font-weight:900;color:#475569}input,select{height:43px;width:100%;border:1px solid #cbd5e1;border-radius:11px;padding:0 11px;background:#fff;outline:none}input:focus,select:focus{border-color:var(--yellow);box-shadow:0 0 0 3px #ffc10722}.readonly{background:#f8fafc!important;color:#475569}.full{grid-column:1/-1}.btn{height:43px;border:0;border-radius:11px;padding:0 15px;font-weight:900}.yellow{background:var(--yellow);color:#111}.dark{background:var(--navy);color:#fff}.toolbar{display:grid;grid-template-columns:1fr 1fr 1.5fr auto;gap:9px;align-items:end}.action-row{display:flex;gap:7px;flex-wrap:wrap}.action{height:38px;border:0;border-radius:9px;padding:0 12px;font-size:10px;font-weight:900;cursor:pointer!important;pointer-events:auto!important;touch-action:manipulation}.hadir{background:#dcfce7;color:#166534}.tidak{background:#fee2e2;color:#991b1b}.libur{background:#fef3c7;color:#92400e}.action.active{box-shadow:0 0 0 3px #0002}.edit{height:36px;border:0;border-radius:9px;background:#fef3c7;color:#92400e;font-weight:900;padding:0 11px}.delete{height:36px;border:0;border-radius:9px;background:#fee2e2;color:#991b1b;font-weight:900;padding:0 11px}.delete:active,.edit:active{transform:scale(.97)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:12px}.kpi{padding:13px;border-radius:14px;color:#fff;background:linear-gradient(135deg,#2563eb,#1d4ed8)}.kpi:nth-child(2){background:linear-gradient(135deg,#16a34a,#059669)}.kpi:nth-child(3){background:linear-gradient(135deg,#ef4444,#dc2626)}.kpi:nth-child(4){background:linear-gradient(135deg,#f59e0b,#d97706)}.kpi small{display:block;font-size:10px;font-weight:900}.kpi b{display:block;font-size:20px;margin-top:6px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:13px}table{width:100%;border-collapse:collapse;min-width:1000px}th{background:var(--navy2);color:#fff;text-align:left;padding:10px;font-size:11px}td{padding:10px;border-bottom:1px solid #edf1f5;font-size:11px;vertical-align:middle}.empty{text-align:center;color:var(--muted);padding:25px}.card-title{font-size:17px;font-weight:900;margin:0 0 10px}.status-pill{display:inline-block;padding:5px 8px;border-radius:999px;font-size:9px;font-weight:900}.status-hadir{background:#dcfce7;color:#166534}.status-tidak{background:#fee2e2;color:#991b1b}.status-libur{background:#e2e8f0;color:#475569}
@media(max-width:1050px){.toolbar{grid-template-columns:1fr 1fr}.kpis{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.header{min-height:64px;padding:8px 10px;gap:8px}.logo{width:42px;height:42px}.brand h1{font-size:14px}.brand p{font-size:9px}.owner{display:none}.wrap{padding:9px 8px}.card{padding:10px}.toolbar,.form-grid{grid-template-columns:1fr}.full{grid-column:auto}.kpi{padding:10px}.kpi b{font-size:16px}table{min-width:1000px}}
</style>
</head>
<body>
<header class="header"><img src="logo.png" class="logo" alt="FIXZY"><div class="brand"><h1>ABSENSI KARYAWAN</h1><p>Input • edit • status hadir/tidak hadir/libur • isolasi per konter</p></div><div class="owner"><b id="ownerName">Memuat...</b><span id="ownerEmail">Firebase</span></div><button class="refresh" id="refreshBtn" title="Refresh">↻</button></header>
<main class="wrap">
<nav class="page-nav"><a href="data-karyawan.html">📄 Ringkasan Gaji</a><a class="active" href="absensi-karyawan.html">📅 Absensi</a><a href="izin-akses.html">⚙️ Setting Upah</a></nav>
<section class="card"><div id="status" class="status">Memeriksa sesi Firebase...</div></section>
<section class="card"><div class="form-grid">
<div class="field"><label>TANGGAL ABSENSI</label><input id="tanggal" type="date"></div><div class="field"><label>NAMA KARYAWAN / TEKNISI</label><select id="employeeSelect"><option value="">-- Pilih Karyawan --</option></select></div>
<div class="field"><label>NO. WHATSAPP</label><input id="wa" class="readonly" readonly></div><div class="field"><label>UPAH HARIAN</label><input id="upah" class="readonly" readonly></div>
<div class="full"><div class="action-row"><button type="button" class="action hadir" id="hadirBtn">✓ HADIR</button><button type="button" class="action tidak" id="tidakBtn">✕ TIDAK HADIR</button><button type="button" class="action libur" id="liburBtn">• LIBUR</button></div></div>
<div class="field full"><label>CATATAN</label><input id="catatan" placeholder="Catatan absensi (opsional)"></div><div class="full"><button class="btn yellow" id="saveBtn">💾 Simpan Absensi</button></div>
</div></section>
<section class="card"><div class="toolbar"><div class="field"><label>BULAN</label><input id="bulan" type="month"></div><div class="field"><label>CARI</label><input id="cari" placeholder="Nama / jabatan..."></div><div></div><button class="btn dark" id="refresh2">↻ Refresh</button></div></section>
<section class="kpis"><div class="kpi"><small>KARYAWAN AKTIF</small><b id="karyawanCount">0</b></div><div class="kpi"><small>HADIR</small><b id="hadir">0</b></div><div class="kpi"><small>TIDAK HADIR</small><b id="tidak">0</b></div><div class="kpi"><small>TOTAL UPAH HADIR</small><b id="totalUpah">Rp 0</b></div></section>
<section class="card"><h2 class="card-title">📅 Daftar Absensi</h2><div class="table-wrap"><table><thead><tr><th>Tanggal</th><th>Nama</th><th>Jabatan</th><th>Status</th><th>Upah</th><th>Catatan</th><th>Aksi</th></tr></thead><tbody id="tbody"><tr><td colspan="7" class="empty">Memuat...</td></tr></tbody></table></div></section>
</main>
<script type="module">
import {initializeApp,getApps,getApp} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import {getAuth,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,deleteDoc,collection,query,where,getDocsFromServer,serverTimestamp} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
const cfg={apiKey:"AIzaSyC_PcarMTT5Un7qfSLzf92o5OGn5rginsI",authDomain:"fixzy-update.firebaseapp.com",projectId:"fixzy-update",storageBucket:"fixzy-update.firebasestorage.app",messagingSenderId:"995892519622",appId:"1:995892519622:web:fa41047944d8e5b35d6dc7"};
const app=getApps().length?getApp():initializeApp(cfg),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id);
let uid="",ownerUid="",profile={},accounts=[],absensi=[],pengeluaran=[],selectedEmployee=null,selectedStatus="";
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}function money(n){return "Rp "+(Number(n)||0).toLocaleString("id-ID");}function norm(v){return String(v??"").trim().toLowerCase();}function today(){return new Date().toISOString().slice(0,10)}function monthNow(){return new Date().toISOString().slice(0,7)}function dateOf(x){return String(x.tanggal||x.date||x.tanggalAbsen||"").slice(0,10)}function nama(a){return String(a.nama||a.namaKaryawan||a.namaLengkap||a.displayName||a.email||"").trim()}function upahHarian(a){return Number(a.upahHarian??a.upah??a.gajiHarian??0)||0}function upahBulanan(a){return Number(a.upahBulanan??a.gajiBulanan??a.gaji??0)||0}function persen(a){return Number(a.persentase??a.persen??a.bonusPersen??0)||0}function isHadir(x){return norm(x.status)==="hadir"||!!(x.jamMasuk||x.masuk||x.hadir===true)}function isLibur(x){return norm(x.status)==="libur"}
async function loadProfile(user){const s=await getDoc(doc(db,"users",user.uid));if(!s.exists())throw new Error("Profil users tidak ditemukan.");profile=s.data()||{};const r=norm(profile.role);if(!["owner","superadmin"].includes(r))throw new Error("Halaman ini hanya untuk OWNER dan SUPERADMIN.");ownerUid=r==="owner"?user.uid:(profile.ownerUid||profile.ownerId||user.uid)}
async function ownedUsers(){const map=new Map();for(const field of ["ownerUid","ownerId"]){try{const s=await getDocsFromServer(query(collection(db,"users"),where(field,"==",ownerUid)));s.docs.forEach(d=>map.set(d.id,{id:d.id,...d.data()}))}catch(e){console.warn("users",field,e.message)}}try{const s=await getDoc(doc(db,"users",uid));if(s.exists())map.set(uid,{id:uid,...s.data()})}catch{}return [...map.values()].filter(x=>["employee","karyawan","kasir","kurir","teknisi"].includes(norm(x.role))||upahHarian(x)>0||upahBulanan(x)>0||persen(x)>0).sort((a,b)=>nama(a).localeCompare(nama(b),"id"))}
async function ownedCollection(name){const map=new Map();for(const field of ["ownerUid","ownerId","uid"]){try{const s=await getDocsFromServer(query(collection(db,name),where(field,"==",ownerUid)));s.docs.forEach(d=>map.set(d.id,{id:d.id,...d.data()}))}catch(e){console.warn(name,field,e.message)}}return [...map.values()]}
async function loadAll(){[accounts,absensi,pengeluaran]=await Promise.all([ownedUsers(),ownedCollection("absensi"),ownedCollection("pengeluaran")])}
function setupHeader(user){$("ownerName").textContent=profile.namaKonter||profile.nama||user.displayName||"Akun FIXZY";$("ownerEmail").textContent=user.email||"Firebase"}
function alertBox(msg){$("status").innerHTML='<span class="err">❌ '+esc(msg)+'</span>';window.scrollTo({top:0,behavior:"smooth"})}
function setStatus(v){selectedStatus=String(v||"");const map={hadir:"hadirBtn",tidak_hadir:"tidakBtn",libur:"liburBtn"};Object.entries(map).forEach(([status,id])=>{const b=$(id);if(!b)return;const active=selectedStatus===status;b.classList.toggle("active",active);b.setAttribute("aria-pressed",active?"true":"false")})}
function employeeWa(a){return a.noWA||a.wa||a.noHp||a.whatsapp||""}function employeeWage(a){return upahHarian(a)}
function selectEmployee(){selectedEmployee=accounts.find(x=>x.id===$("employeeSelect").value)||null;if(!selectedEmployee){$("wa").value="";$("upah").value="";return}$("wa").value=employeeWa(selectedEmployee);$("upah").value=money(employeeWage(selectedEmployee));loadExisting()}
async function loadExisting(){if(!selectedEmployee)return;const id=`${selectedEmployee.id}_${$("tanggal").value||today()}`;try{const s=await getDoc(doc(db,"absensi",id));if(s.exists()){const x=s.data();setStatus(norm(x.status)||"tidak_hadir");$("catatan").value=x.catatan||""}else{setStatus("");$("catatan").value=""}}catch(e){console.warn(e)}}
async function saveAttendance(){if(!selectedEmployee)return alertBox("Pilih karyawan terlebih dahulu.");if(!selectedStatus)return alertBox("Pilih HADIR, TIDAK HADIR, atau LIBUR.");const tanggal=$("tanggal").value||today(),id=`${selectedEmployee.id}_${tanggal}`;const data={ownerUid,ownerId:ownerUid,userId:selectedEmployee.id,uid:selectedEmployee.id,nama:nama(selectedEmployee),namaKaryawan:nama(selectedEmployee),email:selectedEmployee.email||"",role:selectedEmployee.role||"employee",jabatan:selectedEmployee.jabatan||selectedEmployee.posisi||"",noWA:employeeWa(selectedEmployee),upahHarian:employeeWage(selectedEmployee),tanggal,status:selectedStatus,hadir:selectedStatus==="hadir",catatan:$("catatan").value.trim(),updatedAt:serverTimestamp(),updatedBy:uid};try{$("saveBtn").disabled=true;$("saveBtn").textContent="Menyimpan...";await setDoc(doc(db,"absensi",id),data,{merge:true});await loadAll();render();setStatus(selectedStatus);$("status").innerHTML='<span class="ok">✓ Absensi berhasil disimpan.</span>'}catch(e){console.error("SAVE ABSENSI ERROR",e);alertBox("Gagal menyimpan: "+(e?.message||e))}finally{$("saveBtn").disabled=false;$("saveBtn").textContent="💾 Simpan Absensi"}}
function editAttendance(id){const x=absensi.find(a=>a.id===id);if(!x)return;$("tanggal").value=x.tanggal||today();$("employeeSelect").value=x.userId||x.uid||"";selectEmployee();setStatus(norm(x.status)||"tidak_hadir");$("catatan").value=x.catatan||"";window.scrollTo({top:0,behavior:"smooth"})}
async function deleteAttendance(id){const x=absensi.find(a=>a.id===id);if(!x)return alertBox("Data absensi tidak ditemukan atau sudah dihapus.");const recordOwner=x.ownerUid||x.ownerId||"";if(recordOwner!==ownerUid){alertBox("Penghapusan ditolak. Identitas pemilik data tidak cocok.");return}const namaKaryawan=x.nama||x.namaKaryawan||"Karyawan",tanggal=dateOf(x)||"-";if(!confirm("HAPUS DATA ABSENSI?\n\nNama: "+namaKaryawan+"\nTanggal: "+tanggal+"\nStatus: "+(x.status||"-")+"\n\nData akan dihapus permanen dari Firebase."))return;try{$("status").textContent="Menghapus data absensi...";await deleteDoc(doc(db,"absensi",id));absensi=absensi.filter(a=>a.id!==id);render();$("status").innerHTML='<span class="ok">✓ Data absensi berhasil dihapus.</span>'}catch(e){console.error("DELETE ABSENSI ERROR",e);alertBox("Gagal menghapus data absensi: "+(e?.message||e))}}
function render(){const month=$("bulan").value||monthNow(),q=norm($("cari").value),rows=absensi.filter(x=>dateOf(x).startsWith(month)).filter(x=>!q||norm(x.nama||x.namaKaryawan).includes(q)||norm(x.jabatan).includes(q)).sort((a,b)=>dateOf(b).localeCompare(dateOf(a)));$("karyawanCount").textContent=accounts.length;$("hadir").textContent=rows.filter(isHadir).length;$("tidak").textContent=rows.filter(x=>!isHadir(x)&&!isLibur(x)).length;$("totalUpah").textContent=money(rows.filter(isHadir).reduce((s,x)=>s+Number(x.upahHarian||0),0));$("tbody").innerHTML=rows.map(x=>`<tr><td>${esc(dateOf(x))}</td><td><b>${esc(x.nama||x.namaKaryawan||"-")}</b></td><td>${esc(x.jabatan||"-")}</td><td><span class="status-pill ${isHadir(x)?"status-hadir":isLibur(x)?"status-libur":"status-tidak"}">${esc(x.status||"-")}</span></td><td>${isHadir(x)?money(x.upahHarian):"Rp 0"}</td><td>${esc(x.catatan||"-")}</td><td><div class="action-row"><button type="button" class="action edit" data-edit="${esc(x.id)}">✏️ Edit</button><button type="button" class="action delete" data-delete="${esc(x.id)}">🗑️ Hapus</button></div></td></tr>`).join("")||'<tr><td colspan="7" class="empty">Belum ada absensi pada bulan ini.</td></tr>'}
async function refresh(){$("status").textContent="⏳ Membaca data Firebase...";try{await loadAll();const sel=$("employeeSelect");sel.innerHTML='<option value="">-- Pilih Karyawan --</option>'+accounts.map(a=>`<option value="${esc(a.id)}">${esc(nama(a))}</option>`).join("");render();$("status").innerHTML='<span class="ok">✓ Data absensi siap • hanya owner ini</span>'}catch(e){alertBox(e.message||e)}}
$("tanggal").value=today();$("bulan").value=monthNow();$("employeeSelect").onchange=selectEmployee;$("tanggal").onchange=loadExisting;
[["hadirBtn","hadir"],["tidakBtn","tidak_hadir"],["liburBtn","libur"]].forEach(([id,status])=>{const b=$(id);if(b){b.type="button";b.addEventListener("click",e=>{e.preventDefault();e.stopPropagation();setStatus(status)});b.addEventListener("touchend",e=>{e.preventDefault();setStatus(status)},{passive:false})}});
$("saveBtn").addEventListener("click",e=>{e.preventDefault();saveAttendance()});$("cari").oninput=render;$("bulan").onchange=refresh;$("refreshBtn").onclick=refresh;$("refresh2").onclick=refresh;
$("tbody").onclick=e=>{const edit=e.target.closest("[data-edit]");if(edit){editAttendance(edit.dataset.edit);return}const del=e.target.closest("[data-delete]");if(del)deleteAttendance(del.dataset.delete)};
onAuthStateChanged(auth,async user=>{if(!user){$("status").innerHTML='<span class="err">❌ Sesi login tidak ditemukan.</span>';return}uid=user.uid;try{await loadProfile(user);setupHeader(user);await refresh()}catch(e){$("status").innerHTML='<span class="err">🔒 '+esc(e.message||e)+'</span>'}});
</script>
</body></html>
