<style>
*{box-sizing:border-box}
:root{--navy:#081326;--navy2:#101d33;--yellow:#ffc107;--bg:#f2f5f9;--card:#fff;--line:#dbe3ed;--text:#172033;--muted:#64748b;--green:#16a34a;--red:#dc2626;--blue:#2563eb;--orange:#f59e0b}

button,input,select{font:inherit}button{cursor:pointer}

<script type="module">
import {initializeApp,getApps,getApp} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import {getAuth,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import {getFirestore,doc,getDoc,collection,query,where,getDocsFromServer} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

const cfg={apiKey:"AIzaSyC_PcarMTT5Un7qfSLzf92o5OGn5rginsI",authDomain:"fixzy-update.firebaseapp.com",projectId:"fixzy-update",storageBucket:"fixzy-update.firebasestorage.app",messagingSenderId:"995892519622",appId:"1:995892519622:web:fa41047944d8e5b35d6dc7"};
const app=getApps().length?getApp():initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);
const $=id=>document.getElementById(id);
let uid="",ownerUid="",profile={},accounts=[],absensi=[],pengeluaran=[],currentRole="",isEmployeeView=false;
let debugLog=[];

function logD(msg){ debugLog.push(msg); console.log("[DEBUG]",msg); $("debugBox").style.display="block"; $("debugBox").textContent=debugLog.join("\n"); }
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
function money(n){return "Rp "+(Number(n)||0).toLocaleString("id-ID");}
function norm(v){return String(v??"").trim().toLowerCase();}
function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}
function monthNow(){return today().slice(0,7);}
function daysInMonth(ym){const [y,m]=ym.split("-").map(Number);return new Date(y,m,0).getDate();}
function dateOf(x){return String(x.tanggal||x.date||x.tanggalAbsen||x.tanggalAbsensi||x.tgl||"").slice(0,10);}
function nama(a){return String(a.nama||a.namaKaryawan||a.namaLengkap||a.displayName||a.email||"").trim();}
function upahHarian(a){return Number(a.upahHarian??a.upah??a.gajiHarian??0)||0;}
function upahBulanan(a){return Number(a.upahBulanan??a.gajiBulanan??a.gaji??0)||0;}
function persen(a){return Number(a.persentase??a.persen??a.bonusPersen??0)||0;}
function jenisUpah(a){return norm(a.jenisUpah||a.sistemUpah||a.tipeUpah||"harian")||"harian";}
function isHadir(x){const st=norm(x.status); return st==="hadir"||st==="masuk"||!!(x.jamMasuk||x.masuk||x.hadir===true||x.isHadir===true);}
function isLibur(x){return norm(x.status)==="libur";}
function isKasbon(x){const j=norm(x.jenis||x.type||x.kategori||"");return j.includes("kasbon")||j.includes("bon")||j.includes("pinjam");}
function kasbonAmount(x){return Number(x.nominal||x.jumlah||x.amount||x.nilai||0)||0;}
function kasbonName(x){return String(x.namaKaryawan||x.nama||x.karyawan||x.penerima||"");}
function isEmployeeRole(r){return ["employee","karyawan","kasir","kurir","teknisi","staff","user","pegawai"].includes(norm(r));}
function isOwnerRole(r){return ["owner","superadmin","admin","pemilik"].includes(norm(r));}

function sameEmployee(x,a){
 const idFields=["userId","uid","karyawanUid","employeeUid","karyawanId","employeeId","karyawan_uid","user_id"];
 for(const f of idFields){
   if(x[f] && String(x[f])===String(a.id)) return true;
 }
 const an=norm(nama(a));
 const xn=norm(x.nama||x.namaKaryawan||x.namaTeknisi||x.karyawan||x.namaKaryawan||x.namaPegawai||"");
 if(!an||!xn) return false;
 // toleransi typo Jhilu vs Jhulu: cek jika 3 huruf awal sama atau salah satu mengandung yang lain
 return an===xn||an.includes(xn)||xn.includes(an)||an.slice(0,3)===xn.slice(0,3);
}

async function loadProfile(user){
 const s=await getDoc(doc(db,"users",user.uid));
 if(!s.exists())throw new Error("Profil users/"+user.uid+" tidak ditemukan.");
 profile=s.data()||{};
 currentRole=norm(profile.role);
 logD(`Login UID=${user.uid} role=${profile.role} nama=${nama(profile)} ownerUid=${profile.ownerUid||profile.ownerId||"-"}`);

 if(isOwnerRole(currentRole)){
   ownerUid = (currentRole==="owner"||currentRole==="pemilik") ? user.uid : (profile.ownerUid||profile.ownerId||user.uid);
   isEmployeeView=false;
 } else if(isEmployeeRole(currentRole)){
   ownerUid = profile.ownerUid||profile.ownerId||profile.ownerKonterUid||profile.konterUid||user.uid;
   isEmployeeView=true;
   if(!profile.ownerUid && !profile.ownerId){
     logD("⚠️ Karyawan tidak punya ownerUid di profil! Akan susah baca data owner. Segera isi ownerUid di Firestore users.");
   }
 } else {
   throw new Error("Role '"+profile.role+"' tidak diizinkan.");
 }
}

async function ownedUsers(){
 const map=new Map();
 if(isEmployeeView){
   try{
     const selfDoc = await getDoc(doc(db,"users",uid));
     if(selfDoc.exists()) map.set(uid,{id:uid,...selfDoc.data()});
     else map.set(uid,{id:uid,...profile});
   }catch(e){ map.set(uid,{id:uid,...profile}); }
   logD(`ownedUsers (employee mode) = ${map.size} data`);
   return [...map.values()];
 }
 for(const field of ["ownerUid","ownerId"]){
  try{const s=await getDocsFromServer(query(collection(db,"users"),where(field,"==",ownerUid)));s.docs.forEach(d=>map.set(d.id,{id:d.id,...d.data()}));}catch(e){logD(`users query ${field} gagal: ${e.message}`);}
 }
 try{const s=await getDoc(doc(db,"users",uid));if(s.exists())map.set(uid,{id:uid,...s.data()});}catch{}
 const filtered=[...map.values()].filter(x=>{
   const r=norm(x.role);
   return ["employee","karyawan","kasir","kurir","teknisi","staff","pegawai"].includes(r) || upahHarian(x)>0 || upahBulanan(x)>0;
 });
 logD(`ownedUsers (owner mode) total=${map.size} filtered karyawan=${filtered.length}`);
 return filtered.sort((a,b)=>nama(a).localeCompare(nama(b),"id"));
}

// === FIX UTAMA DISINI ===
async function ownedCollection(name){
 const map=new Map();
 const namaSaya = nama(profile);
 const attempts=[];

 if(isEmployeeView){
   // Coba SEMUA kemungkinan field agar absensi ketemu
   const queriesToTry = [
     {field:"ownerUid", value:ownerUid},
     {field:"ownerId", value:ownerUid},
     {field:"userId", value:uid},
     {field:"uid", value:uid},
     {field:"karyawanUid", value:uid},
     {field:"employeeUid", value:uid},
     {field:"karyawanId", value:uid},
     {field:"employeeId", value:uid},
     // By nama (jika rules izinkan baca by nama tanpa ownerUid)
     {field:"namaKaryawan", value:namaSaya},
     {field:"nama", value:namaSaya},
     {field:"karyawan", value:namaSaya},
   ];

   for(const q of queriesToTry){
     if(!q.value) continue;
     try{
       const s=await getDocsFromServer(query(collection(db,name),where(q.field,"==",q.value)));
       const before=map.size;
       s.docs.forEach(d=>map.set(d.id,{id:d.id,...d.data()}));
       const added=map.size-before;
       if(added>0) logD(`${name}: query ${q.field}==${q.value} -> +${added} docs`);
       attempts.push(`${q.field}:${added}`);
     }catch(e){
       logD(`${name}: query ${q.field}==${q.value} GAGAL: ${e.message}`);
     }
   }

   // Jika masih kosong, coba tanpa filter ownerUid tapi filter manual by sameEmployee (butuh rules allow read all where ownerUid sama)
   // Kita coba ambil 50 docs terakhir dari ownerUid jika diizinkan
   if(map.size===0){
     logD(`${name}: masih 0, coba fallback ambil semua dengan ownerUid=${ownerUid} lalu filter manual`);
     for(const field of ["ownerUid","ownerId"]){
       try{
         const s=await getDocsFromServer(query(collection(db,name),where(field,"==",ownerUid)));
         let matched=0;
         s.docs.forEach(d=>{
           const data=d.data();
           // Untuk absensi: kalau employee view, anggap semua yang ownerUid sama dan nama mirip adalah milik dia
           if(name==="absensi"||name==="pengeluaran"){
             if(sameEmployee(data,{id:uid,nama:namaSaya})){
               if(!map.has(d.id)){ map.set(d.id,{id:d.id,...data}); matched++; }
             }
           } else {
             map.set(d.id,{id:d.id,...data});
           }
         });
         if(matched>0) logD(`${name}: fallback ${field} manual filter +${matched}`);
       }catch(e){ logD(`${name}: fallback ${field} gagal ${e.message}`); }
     }
   }

 } else {
   // OWNER MODE - sama seperti sebelumnya
   for(const field of ["ownerUid","ownerId","uid"]){
    try{
      const s=await getDocsFromServer(query(collection(db,name),where(field,"==",ownerUid)));
      s.docs.forEach(d=>map.set(d.id,{id:d.id,...d.data()}));
    }catch(e){logD(`${name} owner query ${field} gagal ${e.message}`);}
   }
 }

 logD(`${name} FINAL total docs=${map.size} attempts=${attempts.join(",")}`);
 return [...map.values()];
}

async function loadAll(){
 debugLog=[];
 $("debugBox").style.display="none";
 $("debugBox").textContent="";
 logD(`Memulai loadAll... period=${periodKey()} uid=${uid} ownerUid=${ownerUid} isEmployee=${isEmployeeView}`);
 [accounts,absensi,pengeluaran]=await Promise.all([ownedUsers(),ownedCollection("absensi"),ownedCollection("pengeluaran")]);
 logD(`Selesai load: accounts=${accounts.length} absensi=${absensi.length} pengeluaran=${pengeluaran.length}`);
 if(isEmployeeView && absensi.length===0){
   logD("❌ ABSENSI 0! Penyebab umum: 1) Absensi tidak punya field userId/karyawanUid=UID karyawan, 2) Firestore Rules tidak izinkan karyawan baca absensi by ownerUid, 3) Nama di absensi beda dengan nama profil (Jhilu vs Jhulu)");
 }
}

function setupHeader(user){
 $("ownerName").textContent=profile.namaKonter||profile.nama||profile.namaKaryawan||user.displayName||"Akun FIXZY";
 $("ownerEmail").textContent= isEmployeeView ? `${profile.role} • ${user.email||""}` : (user.email||"Firebase");
 if(isEmployeeView){
   $("brandTitle").textContent="GAJI SAYA";
   $("brandSub").textContent="Rincian gaji pribadi • "+nama(profile);
   $("listTitle").textContent="💰 Rincian Gaji Saya";
   $("employeeNotice").style.display="block";
   $("employeeNotice").innerHTML=`👋 Halo <b>${esc(nama(profile))}</b>! Mode karyawan aktif. Kamu hanya lihat data pribadimu. Jika 0 hadir padahal sudah absen, laporkan ke owner agar field <b>userId</b> di absensi diisi UID kamu.`;
   const navSet=$("navSetting"); if(navSet) navSet.style.display="none";
   $("searchLabel").textContent="FILTER PERIODE";
   $("cari").placeholder="Cari...";
 } else {
   $("employeeNotice").style.display="none";
 }
}

async function boot(loadFn){onAuthStateChanged(auth,async user=>{if(!user){$("status").innerHTML='<span class="err">❌ Sesi login tidak ditemukan.</span>';return;}uid=user.uid;try{await loadProfile(user);setupHeader(user);await loadFn();}catch(e){$("status").innerHTML='<span class="err">🔒 '+esc(e.message||e)+'</span>'; logD("BOOT ERROR: "+e.message);}});}

function periodKey(){const p=$("periode").value,v=$("periodeTanggal").value;if(p==="hari")return v||today();if(p==="tahun")return(v||monthNow()).slice(0,4);return v||monthNow();}
function matchPeriod(x){const d=dateOf(x),k=periodKey();if(!d||!k)return false;if(k.length===10)return d===k;if(k.length===7)return d.startsWith(k);return d.startsWith(k);}
function kasbonFor(a){return pengeluaran.filter(x=>matchPeriod(x)&&isKasbon(x)&&sameEmployee(x,{id:"",nama:kasbonName(x)}));}
function calculate(a){
 const rows=absensi.filter(x=>matchPeriod(x)&&sameEmployee(x,a));
 const hadir=rows.filter(isHadir).length,libur=rows.filter(isLibur).length,tidak=rows.filter(x=>!isHadir(x)&&!isLibur(x)).length;
 const jenis=jenisUpah(a),ym=periodKey().slice(0,7)||monthNow(),kalender=daysInMonth(ym),hd=upahHarian(a),bm=upahBulanan(a),ps=persen(a);
 let base=0,percentPay=0;
 if(jenis==="harian")base=hadir*hd;
 else if(jenis==="bulanan")base=bm;
 else if(jenis==="persentase")percentPay=0;
 else if(jenis==="harian_persentase")base=hadir*hd;
 else if(jenis==="bulanan_persentase")base=bm;
 const gross=base+percentPay,kb=kasbonFor(a).reduce((s,x)=>s+kasbonAmount(x),0);
 return {kalender,hadir,libur,tidak,gross,kb,net:Math.max(0,gross-kb),jenis,hd,bm,ps, _debugRows:rows};
}
function jenisLabel(j){return({harian:"Harian",bulanan:"Bulanan",persentase:"Persentase",harian_persentase:"Harian + %",bulanan_persentase:"Bulanan + %"})[j]||"Harian";}
function tarifLabel(c){if(c.jenis==="harian")return money(c.hd)+"/hari";if(c.jenis==="bulanan")return money(c.bm)+"/bulan";if(c.jenis==="persentase")return c.ps+"%";if(c.jenis==="harian_persentase")return money(c.hd)+" + "+c.ps+"%";return money(c.bm)+" + "+c.ps+"%";}

function waNumber(value){let n=String(value||"").replace(/\D/g,"");if(n.startsWith("0"))n="62"+n.slice(1);else if(n.startsWith("8"))n="62"+n;return n;}

function render(){
 const q=norm($("cari").value),all=accounts.map(a=>({a,c:calculate(a)})),rows=isEmployeeView ? all : all.filter(r=>!q||[nama(r.a),r.a.jabatan,r.a.posisi,r.a.role].join(" ").toLowerCase().includes(q));
 $("karyawan").textContent=all.length;$("hadir").textContent=all.reduce((s,r)=>s+r.c.hadir,0);$("gross").textContent=money(all.reduce((s,r)=>s+r.c.gross,0));$("kasbon").textContent=money(all.reduce((s,r)=>s+r.c.kb,0));$("net").textContent=money(all.reduce((s,r)=>s+r.c.net,0));

 if(isEmployeeView && all.length>0){
   const c=all[0].c;
   logD(`RENDER Karyawan ${nama(all[0].a)}: period=${periodKey()} rows matched=${c._debugRows.length} hadir=${c.hadir} gross=${c.gross}`);
   if(c._debugRows.length>0) logD(`Contoh absensi match: ${JSON.stringify(c._debugRows[0]).slice(0,300)}`);
 }

 $("salarySummary").innerHTML=rows.map(r=>{
  let waBtn="";
  if(!isEmployeeView){
    const phone=waNumber(employeePhone(r.a));
    waBtn = phone?`<button class="btn wa-btn" type="button" onclick="sendSalaryWA('${esc(r.a.id)}')">📲 Kirim Info Gaji via WhatsApp</button>`:`<button class="btn light" type="button" disabled>📵 Nomor WA belum diisi</button>`;
  } else {
    waBtn = `<div class="notice">Periode <b>${esc(periodKey())}</b> • ${r.c.hadir} hadir dari ${r.c.kalender} hari kalender. Jika 0 padahal sudah absen, minta owner cek data absensi.</div>`;
  }
  return `<div class="salary-card"><div class="salary-head"><div><b>${esc(nama(r.a))}</b><small>${esc(r.a.jabatan||r.a.posisi||"-")} • ${esc(jenisLabel(r.c.jenis))}</small></div><span class="status-pill ${r.c.hadir?"status-hadir":"status-tidak"}">${r.c.hadir?r.c.hadir+" Hadir":"Belum Hadir"}</span></div><div class="salary-body"><div class="salary-grid">
 <div class="salary-item"><small>HARI KALENDER</small><b>${r.c.kalender} hari</b></div><div class="salary-item"><small>HADIR</small><b>${r.c.hadir} hari</b></div><div class="salary-item"><small>LIBUR</small><b>${r.c.libur} hari</b></div><div class="salary-item"><small>TIDAK HADIR</small><b>${r.c.tidak} hari</b></div><div class="salary-item"><small>TARIF</small><b>${esc(tarifLabel(r.c))}</b></div><div class="salary-item"><small>KASBON</small><b>${money(r.c.kb)}</b></div></div>
 <div class="salary-total"><div class="salary-gross"><small>UPAH KOTOR </small><b>${money(r.c.gross)}</b></div><div class="salary-net"><small>SISA DITERIMA </small><b>${money(r.c.net)}</b></div></div>
 <div class="salary-actions">${waBtn}</div></div></div>`;
 }).join("")||'<div class="empty">Belum ada data.</div>';
}
window.sendSalaryWA=function(employeeId){
 const a=accounts.find(x=>String(x.id)===String(employeeId));
 if(!a){alert("Data karyawan tidak ditemukan.");return;}
 const phone=waNumber(employeePhone(a));
 if(!phone){alert("Nomor WhatsApp belum diisi.");return;}
 const c=calculate(a),p=periodKey(),periodText=p.length===10?new Date(p+"T12:00:00").toLocaleDateString("id-ID",{day:"numeric",month:"long",year:"numeric"}):p.length===4?p: new Date(p+"-01T12:00:00").toLocaleDateString("id-ID",{month:"long",year:"numeric"});
 const msg=[`Halo Kak ${nama(a)}, berikut rincian gaji kamu dari ${profile.namaKonter||profile.nama||"Pemilik"}.`,`Periode: ${periodText}`,`Hadir: ${c.hadir} hari`,`Tarif: ${tarifLabel(c)}`,`TOTAL UPAH: ${money(c.gross)}`,`Kasbon: ${money(c.kb)}`,`SISA DITERIMA: ${money(c.net)}`].join("\n");
 window.open("https://wa.me/"+phone+"?text="+encodeURIComponent(msg),"_blank");
};
async function refresh(){
 $("status").textContent="⏳ Membaca data Firebase...";
 try{
   await loadAll();
   render();
   const mode=isEmployeeView ? "Mode Karyawan (Pribadi)" : "Mode Owner";
   $("status").innerHTML=`<span class="ok">✓ ${accounts.length} karyawan • Absensi ${absensi.length} • Pengeluaran ${pengeluaran.length} • ${mode} • Isolasi aktif</span>`;
 }catch(e){$("status").innerHTML='<span class="err">❌ '+esc(e.message||e)+'</span>'; logD("Refresh error: "+e.message);}
}
$("refreshBtn").onclick=refresh;$("refresh2").onclick=refresh;$("cari").oninput=render;
$("periode").onchange=()=>{const p=$("periode").value,f=$("periodeTanggal");f.type=p==="hari"?"date":"month";f.value=p==="hari"?today():monthNow();refresh();};
$("periodeTanggal").onchange=refresh;$("periodeTanggal").value=monthNow();
boot(refresh);
</script>
