<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0f14"><title>FIXZY | Scan Nota</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef2f6;color:#111827;font:15px Arial}header{background:#0b0f14;color:white;border-bottom:4px solid #ffc107;padding:18px}header h1{max-width:640px;margin:auto;font-size:20px}main{max-width:640px;margin:18px auto;padding:0 12px}.card{background:white;border:2px solid #111827;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:4px 4px #111827}h2{font-size:16px;margin:0 0 10px}.desc,.msg{font-size:13px;line-height:1.5;color:#64748b}button,a.btn{display:block;width:100%;padding:13px;border:2px solid #111827;border-radius:9px;font-weight:900;text-align:center;text-decoration:none;margin-top:9px;cursor:pointer;background:#ffc107;color:#111827}button.dark,a.dark{background:#111827;color:white}input{width:100%;padding:13px;border:2px solid #111827;border-radius:9px;font-size:16px}#reader{width:100%;overflow:hidden}#reader video{max-width:100%}.error{color:#b91c1c}footer{text-align:center;color:#64748b;font-size:11px;padding:15px}
</style></head><body><header><h1>FIXZY — SCAN NOTA SERVIS</h1></header><main>
<section class="card"><h2>📷 Pindai QR Nota</h2><p class="desc">Tekan tombol, izinkan kamera, lalu arahkan ke QR pada nota.</p><div id="reader"></div><button id="start">Buka Kamera / Mulai Scan</button><button id="stop" class="dark" disabled>Hentikan Kamera</button><div id="scanMsg" class="msg">Kamera memerlukan HTTPS dan izin dari browser.</div></section>
<section class="card"><h2>⌨️ Cari Nomor Nota</h2><form id="form"><input id="nota" placeholder="Masukkan nomor nota" required><button class="dark">Periksa Status Servis</button></form><div id="msg" class="msg"></div></section></main><footer>FIXZY • Pemeriksaan servis pelanggan</footer>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><script>
const $=x=>document.getElementById(x);function openCheck(raw){let n=String(raw||'').trim();try{let u=new URL(n,location.href);n=u.searchParams.get('nota')||u.searchParams.get('code')||u.searchParams.get('token')||n}catch(e){}if(!n){$('scanMsg').textContent='QR tidak berisi nomor nota.';return}location.href='cek-servis.html?nota='+encodeURIComponent(n)}
let qr=null,running=false;$('start').onclick=async()=>{try{if(!window.Html5Qrcode)throw Error('Library scanner belum termuat. Periksa internet.');if(!qr)qr=new Html5Qrcode('reader');await qr.start({facingMode:'environment'},{fps:10,qrbox:{width:230,height:230}},v=>{qr.stop().catch(()=>{});running=false;$('start').disabled=false;$('stop').disabled=true;openCheck(v)},()=>{});running=true;$('start').disabled=true;$('stop').disabled=false;$('scanMsg').textContent='Kamera aktif. Arahkan ke QR.'}catch(e){$('scanMsg').className='msg error';$('scanMsg').textContent='Kamera gagal dibuka: '+e.message+' Pastikan HTTPS dan izin kamera aktif.'}};
$('stop').onclick=async()=>{if(qr&&running)try{await qr.stop()}catch(e){}running=false;$('start').disabled=false;$('stop').disabled=true;$('scanMsg').textContent='Pemindaian dihentikan.'};
$('form').onsubmit=e=>{e.preventDefault();openCheck($('nota').value)};const n=new URLSearchParams(location.search).get('nota');if(n)$('nota').value=n;
</script></body></html>
