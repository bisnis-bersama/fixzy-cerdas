<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0f14"><title>FIXZY | Status Servis</title><style>*{box-sizing:border-box}body{margin:0;background:#eef2f6;color:#111827;font-family:Arial,sans-serif}.head{background:#0b0f14;color:white;border-bottom:4px solid #ffc107;padding:18px 16px;text-align:center}.head b{font-size:23px;color:#ffc107}.wrap{max-width:560px;margin:22px auto;padding:0 14px}.card{background:white;border:2px solid #111827;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:4px 4px 0 #111827}h2{margin:0 0 12px;font-size:20px}.row{display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid #e5e7eb;font-size:14px}.row:last-child{border-bottom:0}.row span{color:#64748b}.row b{text-align:right;max-width:60%;overflow-wrap:anywhere}.status{display:inline-block;background:#ffc107;color:#111827;border:2px solid #111827;border-radius:999px;padding:7px 13px;font-weight:900;text-transform:uppercase}.msg{color:#64748b;font-size:14px;line-height:1.5}.err{color:#b91c1c}button{width:100%;padding:12px;border-radius:9px;border:2px solid #111827;background:#111827;color:white;font-weight:800;font-size:15px}footer{text-align:center;font-size:12px;color:#64748b;padding:18px}</style></head><body><header class="head"><b>FIXZY BUSINESS</b><div>STATUS SERVIS HP</div></header><main class="wrap"><section class="card"><h2>Informasi Servis</h2><div id="content" class="msg">Memuat data servis...</div></section><section class="card"><button onclick="location.href='scan-barcode.html'">🔎 Scan / Cari Nota Lain</button></section></main><footer>Informasi ini menampilkan status servis saja. Data pribadi pelanggan tidak ditampilkan.</footer><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';import{getFirestore,doc,getDoc}from'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';const cfg={apiKey:'AIzaSyC_PcarMTT5Un7qfSLzf92o5OGn5rginsI',authDomain:'fixzy-update.firebaseapp.com',projectId:'fixzy-update',storageBucket:'fixzy-update.firebasestorage.app',messagingSenderId:'995892519622',appId:'1:995892519622:web:fa41047944d8e5b35d6dc7'};const db=getFirestore(initializeApp(cfg));const $=id=>document.getElementById(id);const nota=new URLSearchParams(location.search).get('nota')||'';const esc=s=>String(s??'-').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const rp=n=>'Rp '+(Number(n)||0).toLocaleString('id-ID');if(!nota){$('content').innerHTML='<span class="err">Nomor nota belum diberikan. Silakan scan QR atau cari nomor nota.</span>'}else{try{const snap=await getDoc(doc(db,'cek_servis_public',nota));if(!snap.exists())throw new Error('Data nota tidak ditemukan. Pastikan nomor nota benar atau data pemeriksaan belum tersedia.');const d=snap.data();const status=String(d.status||'masuk').toUpperCase();$('content').innerHTML=`<div class="row"><span>Nomor Nota</span><b>${esc(d.nomorNota)}</b></div><div class="row"><span>Tanggal</span><b>${esc(d.tanggal)}</b></div><div class="row"><span>Konter</span><b>${esc(d.namaKonter||'FIXZY')}</b></div><div class="row"><span>Perangkat</span><b>${esc(d.brandTipe)}</b></div><div class="row"><span>Kerusakan</span><b>${esc(d.jenisKerusakan)}</b></div><div class="row"><span>Teknisi</span><b>${esc(d.namaTeknisi)}</b></div><div class="row"><span>Status</span><b><span class="status">${esc(status)}</span></b></div><div class="row"><span>Estimasi Biaya</span><b>${rp(d.estimasiBiaya)}</b></div><div class="row"><span>DP</span><b>${rp(d.dp)}</b></div><div class="row"><span>Sisa</span><b>${rp(d.sisa)}</b></div><p class="msg">Status diperbarui mengikuti data pemeriksaan yang terakhir disimpan.</p>`}catch(e){console.error(e);$('content').innerHTML='<span class="err">'+esc(e.message||'Gagal memuat status servis.')+'</span><p class="msg">Jika data sudah tersimpan tetapi tidak muncul, halaman publik perlu diberi akses baca khusus ke dokumen cek_servis_public.</p>'}}</script></body></html>
