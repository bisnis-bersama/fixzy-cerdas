<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0f14"><title>A YUDI THEA | Cek Status Servis</title>
<style>*{box-sizing:border-box}body{margin:0;background:#eef2f6;color:#111827;font-family:Arial,sans-serif}.head{background:#0b0f14;color:#fff;border-bottom:4px solid #ffc107;padding:18px 14px;text-align:center}.head b{color:#ffc107}.wrap{max-width:560px;margin:20px auto;padding:0 12px}.card{background:#fff;border:2px solid #111827;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:4px 4px 0 #111827}.title{font-weight:900;font-size:20px;margin:0 0 12px}.row{display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid #e5e7eb;font-size:13px}.row:last-child{border-bottom:0}.row span{color:#64748b}.row b{text-align:right;max-width:60%;overflow-wrap:anywhere}.status{display:inline-block;background:#ffc107;color:#111827;padding:7px 11px;border-radius:999px;font-weight:900}.muted{font-size:13px;line-height:1.5;color:#64748b}button{width:100%;padding:13px;border:2px solid #111827;border-radius:9px;background:#ffc107;font-weight:900;box-shadow:3px 3px 0 #111827;cursor:pointer}.error{color:#b91c1c;font-weight:800}</style>
</head><body><header class="head"><div style="font-size:22px;font-weight:900">A YUDI THEA <b>CEK SERVIS</b></div><div style="font-size:12px;margin-top:5px">Software &amp; Hardware Solution</div><div style="font-size:11px;margin-top:4px">Depan Pasar Hewan, Blok Jum'at, Maja Utara, Maja, Majalengka</div></header>
<main class="wrap"><section class="card"><h1 class="title">Status Servis Anda</h1><p id="loading" class="muted">Memuat data servis...</p><div id="detail" hidden></div><p id="err" class="error"></p><button onclick="location.href='scan-barcode.html'">SCAN / CEK NOTA LAIN</button></section><p class="muted">Halaman ini hanya menampilkan ringkasan servis. Data pribadi pelanggan, nomor WhatsApp, alamat, IMEI, sandi, dan pola kunci tidak ditampilkan.</p></main>
<script type="module">
import { initializeApp, getApps, getApp } from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import { getFirestore, doc, getDoc } from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';

const cfg = {
  apiKey: 'AIzaSyC_PcarMTT5Un7qfSLzf92o5OGn5rginsI',
  authDomain: 'fixzy-update.firebaseapp.com',
  projectId: 'fixzy-update',
  storageBucket: 'fixzy-update.firebasestorage.app',
  messagingSenderId: '995892519622',
  appId: '1:995892519622:web:fa41047944d8e5b35d6dc7'
};
const app = getApps().length ? getApp() : initializeApp(cfg);
const db = getFirestore(app);
const $ = id => document.getElementById(id);
const safe = v => String(v ?? '-').replace(/[&<>"']/g, c => ({
  '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
}[c]));
const money = v => 'Rp ' + (Number(v) || 0).toLocaleString('id-ID');
function row(label, value) {
  return `<div class="row"><span>${safe(label)}</span><b>${safe(value)}</b></div>`;
}
function shortNote(nota) {
  const match = String(nota || '').match(/(\d{4})$/);
  return match ? match[1] : '';
}
async function readPublic(nota) {
  // savePublicServis menyimpan dokumen publik memakai nomor nota 4 digit.
  const short = shortNote(nota);
  const ids = [...new Set([short, nota].filter(Boolean))];
  for (const id of ids) {
    const snap = await getDoc(doc(db, 'cek_servis_public', id));
    if (snap.exists()) return snap;
  }
  return null;
}
async function load() {
  const nota = String(new URLSearchParams(location.search).get('nota') || '').trim();
  if (!nota) {
    $('loading').textContent = 'Nomor nota belum diisi.';
    $('err').textContent = 'Silakan scan QR atau masukkan nomor nota.';
    return;
  }
  try {
    const snap = await readPublic(nota);
    $('loading').hidden = true;
    if (!snap) {
      $('err').textContent = 'Data cek servis publik belum tersedia atau nomor nota tidak ditemukan. Pastikan data publik sudah tersimpan, lalu coba lagi.';
      return;
    }
    const d = snap.data() || {};
    $('detail').hidden = false;
    $('detail').innerHTML = `
      ${row('Nomor Nota', d.nomorNota || nota)}
      ${row('Tanggal', d.tanggal || '-')}
      ${row('Konter', d.namaKonter || 'A YUDI THEA')}
      ${row('Alamat Konter', d.alamatKonter || "Depan Pasar Hewan, Blok Jum'at, Maja Utara, Maja, Majalengka")}
      ${row('Perangkat', d.brandTipe || '-')}
      ${row('Keluhan', d.jenisKerusakan || '-')}
      ${row('Teknisi', d.namaTeknisi || '-')}
      <div class="row"><span>Status</span><b><span class="status">${safe(d.status || 'Dalam proses')}</span></b></div>
      ${row('Estimasi Biaya', money(d.estimasiBiaya))}
      ${row('DP', money(d.dp))}
      ${row('Sisa Pembayaran', money(d.sisa))}
    `;
  } catch (e) {
    console.error('Gagal memuat status servis:', e);
    $('loading').hidden = true;
    $('err').textContent = 'Status servis gagal dimuat. Periksa koneksi internet dan izin baca dokumen cek_servis_public di Firebase.';
  }
}
load();
</script></body></html>
