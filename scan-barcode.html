<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0f14"><title>FIXZY | Scan QR Servis</title>
<style>*{box-sizing:border-box}body{margin:0;background:#eef2f6;color:#111827;font-family:Arial,sans-serif}.head{background:#0b0f14;color:#fff;border-bottom:4px solid #ffc107;padding:18px 14px;text-align:center}.head b{color:#ffc107}.wrap{max-width:520px;margin:20px auto;padding:0 12px}.card{background:#fff;border:2px solid #111827;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:4px 4px 0 #111827}.title{font-weight:900;font-size:18px;margin:0 0 8px}.sub{font-size:13px;line-height:1.5;color:#4b5563}input,button{width:100%;padding:13px;border-radius:9px;font:inherit}input{border:2px solid #111827;margin:10px 0}button{border:2px solid #111827;background:#ffc107;font-weight:900;cursor:pointer;box-shadow:3px 3px 0 #111827}.secondary{background:#fff;margin-top:10px}#reader{width:100%;overflow:hidden;border-radius:10px}#msg{font-size:13px;font-weight:700;margin-top:10px;color:#b91c1c}</style>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script></head><body>
<header class="head"><div style="font-size:22px;font-weight:900">FIXZY <b>CEK SERVIS</b></div><div style="font-size:12px;margin-top:5px">Pindai QR pada nota servis</div></header>
<main class="wrap"><section class="card"><h1 class="title">Scan QR Servis</h1><p class="sub">Arahkan kamera ke QR dari nota FIXZY. Jika kamera tidak tersedia, masukkan nomor nota secara manual.</p><div id="reader"></div><div id="msg"></div></section>
<section class="card"><label for="nota" style="font-weight:900">Nomor nota</label><input id="nota" placeholder="Contoh: SRV-20261015-001" autocomplete="off"><button onclick="cekManual()">CEK STATUS SERVIS</button><button class="secondary" onclick="mulaiScan()">AKTIFKAN KAMERA</button></section></main>
<script>
const $=id=>document.getElementById(id);let scanner=null,locked=false;
function setMsg(t){$('msg').textContent=t}
function noteFromValue(value){
 try{const u=new URL(value,location.href);const n=u.searchParams.get('nota');if(n)return n;}catch(e){}
 return String(value||'').trim();
}
function goNota(value){const n=noteFromValue(value);if(!n){setMsg('Nomor nota tidak terbaca.');return}location.href='cek-servis.html?nota='+encodeURIComponent(n)}
window.cekManual=()=>goNota($('nota').value);
async function mulaiScan(){
 if(!window.Html5Qrcode){setMsg('Library kamera gagal dimuat. Gunakan input nomor nota.');return}
 try{
  if(!scanner)scanner=new Html5Qrcode('reader');
  if(scanner.isScanning)return;
  setMsg('Meminta izin kamera...');
  await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:240,height:240}},async decoded=>{
   if(locked)return;locked=true;try{await scanner.stop()}catch(e){}goNota(decoded);
  },()=>{});
  setMsg('Kamera aktif. Arahkan ke QR servis.');
 }catch(e){setMsg('Kamera tidak dapat dibuka. Izinkan akses kamera atau masukkan nomor nota manual.')}
}
const params=new URLSearchParams(location.search);if(params.get('nota'))$('nota').value=params.get('nota');
if(params.get('nota'))setTimeout(()=>goNota(params.get('nota')),250);
</script></body></html>
