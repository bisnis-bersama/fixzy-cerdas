<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0f14">
<title>FIXZY | Tagihan Pelanggan</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef2f6;color:#111827;font-family:Arial,sans-serif}header{position:sticky;top:0;z-index:5;background:#0b0f14;color:white;border-bottom:4px solid #ffc107;padding:15px}header .in{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px}header .brand{display:flex;align-items:center;gap:11px;min-width:0}header .logo{width:54px;height:54px;object-fit:contain;border-radius:12px;background:#000;border:1px solid #334155;padding:3px;flex:none}header .brand-text{min-width:0}header h1{font-size:20px;margin:0}header small{color:#cbd5e1}.wrap{max-width:1100px;margin:18px auto;padding:0 12px}.card{background:#fff;border:2px solid #111827;border-radius:17px;padding:16px;margin-bottom:15px;box-shadow:4px 4px 0 #111827}.grid{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:10px}label{display:block;font-size:11px;font-weight:900;color:#475569;margin:0 0 5px}input{width:100%;min-height:44px;border:2px solid #111827;border-radius:10px;padding:10px;font:inherit}.btn{border:0;border-radius:10px;padding:12px 14px;font-weight:900;cursor:pointer}.yellow{background:#ffc107;color:#111827}.dark{background:#111827;color:white}.green{background:#16a34a;color:white}.summary{background:#111827;color:white;border-radius:13px;padding:14px;line-height:1.7;margin-bottom:14px}.summary b{color:#ffc107}.person{border:2px solid #111827;border-radius:14px;padding:13px;margin-top:12px}.personhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}.person h3{margin:0;font-size:17px}.muted{color:#64748b;font-size:12px;line-height:1.5}.tablewrap{overflow:auto;margin-top:10px}table{border-collapse:collapse;width:100%;min-width:600px;font-size:12px}th,td{text-align:left;padding:9px;border-bottom:1px solid #e5e7eb}th{background:#f8fafc}.total{font-size:17px;font-weight:900;color:#b45309;margin:12px 0}.err{color:#b91c1c;font-weight:800;white-space:pre-wrap}.empty{padding:18px;text-align:center;color:#64748b}@media(max-width:650px){.grid{grid-template-columns:1fr}.personhead .btn{width:100%}header h1{font-size:15px}header .logo{width:44px;height:44px}header .in{gap:7px}header .btn{padding:10px 9px;font-size:11px}}
</style>
</head><body>
<header><div class="in"><div class="brand"><img class="logo" src="logofixzy.png" alt="Logo FIXZY" onerror="this.style.display='none'"><div class="brand-text"><h1>FIXZY — TAGIHAN PELANGGAN</h1><small id="accountLine">Memuat akun...</small></div></div><button class="btn yellow" onclick="location.href='data-penjualan.html'">← Data Penjualan</button></div></header>
<main class="wrap"><section class="card"><h2 style="margin:0 0 14px">Pencarian Tagihan</h2><div class="grid"><div><label>NAMA / NOMOR WHATSAPP</label><input id="search" placeholder="Cari nama atau nomor WA"></div><div><label>TANGGAL DARI</label><input id="from" type="date"></div><div><label>TANGGAL SAMPAI</label><input id="to" type="date"></div></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="btn yellow" id="filterBtn">🔎 Tampilkan Tagihan</button><button class="btn dark" id="reloadBtn">↻ Muat Ulang</button></div><p id="msg" class="muted">Tagihan diambil dari transaksi penjualan dengan status Tagihan dan sisa pembayaran lebih dari Rp0.</p></section>
<div id="summary" class="summary">Memuat ringkasan...</div><section class="card"><div id="results"><div class="empty">Memuat data...</div></div></section></main>
<script type="module">
import{initializeApp,getApps,getApp}from'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import{getAuth,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
import{getFirestore,collection,query,where,getDocs,getDocsFromServer,doc,getDoc}from'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';
const cfg={apiKey:'AIzaSyC_PcarMTT5Un7qfSLzf92o5OGn5rginsI',authDomain:'fixzy-update.firebaseapp.com',projectId:'fixzy-update',storageBucket:'fixzy-update.firebasestorage.app',messagingSenderId:'995892519622',appId:'1:995892519622:web:fa41047944d8e5b35d6dc7'};
const app=getApps().length?getApp():initializeApp(cfg),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id);let ownerUid='',all=[];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'Rp '+(Number(n)||0).toLocaleString('id-ID');
const name=d=>d.pelanggan?.nama||d.namaPelanggan||d.nama||'Pelanggan';
const phone=d=>d.noHp||d.noWhatsapp||d.whatsapp||d.pelanggan?.wa||d.hp||d.nomorWa||d.wa||'';
const date=d=>{let v=d.tanggal??d.tanggalPenjualan??d.createdAt??'';if(v&&typeof v==='object'&&v.toDate)v=v.toDate().toISOString();return String(v).slice(0,10)};
const total=d=>Number(d.total??d.totalBayar??0)||0,diskon=d=>Number(d.diskon??d.potongan??0)||0,dp=d=>Number(d.dp??d.uangMuka??0)||0;
const sisa=d=>['tunai','batal'].includes(String(d.status||'').toLowerCase())?0:Math.max(0,Number(d.sisa??(total(d)-diskon(d)-dp(d)))||0);
const products=d=>{let p=d.items||d.produkList||d.namaProduk||d.produk||d.barang||d.detailProduk;if(Array.isArray(p))return p.map(x=>typeof x==='string'?x:(x.nama||x.namaProduk||x.produk||x.namaBarang||x.name||'Produk')).join(', ');return String(p||'-')};
function fmtDate(v){if(!v)return'-';let p=v.split('-');return p.length===3?`${p[2]}-${p[1]}-${p[0]}`:v}
function normPhone(v){let n=String(v||'').replace(/\D/g,'');if(n.startsWith('0'))n='62'+n.slice(1);else if(n.startsWith('8'))n='62'+n;return n}
function filterData(){const q=$('search').value.trim().toLowerCase(),from=$('from').value,to=$('to').value;return all.filter(d=>String(d.status||'').toLowerCase()==='tagihan'&&sisa(d)>0&&(!from||date(d)>=from)&&(!to||date(d)<=to)&&(!q||[name(d),phone(d)].join(' ').toLowerCase().includes(q)))}
function waMessage(person,rows,from,to){let lines=[`Halo ${person.nama}, kami dari ${rows[0]?.namaKonter||'A Yudi Thea'} ingin mengirimkan rekap tagihan penjualan.`,`Periode: ${from?fmtDate(from):'awal data'} s.d. ${to?fmtDate(to):'hari ini'}.`,''];let sum=0;rows.forEach((d,i)=>{let left=sisa(d);sum+=left;lines.push(`${i+1}. Nota: ${d.nomorNota||d.nota||d.id}`,`   Tanggal: ${fmtDate(date(d))}`,`   Produk: ${products(d)}`,`   Total: ${money(Math.max(0,total(d)-diskon(d)))}`,`   DP: ${money(dp(d))}`,`   Sisa: ${money(left)}`,'')});lines.push(`TOTAL TAGIHAN: ${money(sum)}`,'','Mohon bantuannya untuk melakukan pelunasan. Jika sudah membayar, mohon kabari kami agar catatan diperbarui. Terima kasih.');return lines.join('\n')}
function render(){const rows=filterData();const sum=rows.reduce((a,d)=>a+sisa(d),0);$('summary').innerHTML=`📋 <b>${rows.length} nota tagihan</b><br>👥 <b>${new Set(rows.map(d=>normPhone(phone(d))||name(d).toLowerCase()).values()).size} pelanggan</b><br>💰 Total sisa tagihan: <b>${money(sum)}</b>`;
const groups=new Map();rows.forEach(d=>{const key=normPhone(phone(d))||name(d).trim().toLowerCase();if(!groups.has(key))groups.set(key,{nama:name(d),wa:phone(d),rows:[]});groups.get(key).rows.push(d)});
if(!groups.size){$('results').innerHTML='<div class="empty">Tidak ada tagihan pada periode ini.</div>';return}
$('results').innerHTML=[...groups.values()].sort((a,b)=>a.nama.localeCompare(b.nama,'id')).map((p,idx)=>{const sum=p.rows.reduce((a,d)=>a+sisa(d),0);const wa=normPhone(p.wa);const text=wa?`https://wa.me/${wa}?text=${encodeURIComponent(waMessage(p,p.rows,$('from').value,$('to').value))}`:'';return `<article class="person"><div class="personhead"><div><h3>${esc(p.nama)}</h3><div class="muted">WhatsApp: ${esc(p.wa||'Belum ada nomor WA')} • ${p.rows.length} nota</div></div>${text?`<button class="btn green" onclick="window.open('${text}','_blank','noopener')">📲 Siapkan WA Tagihan</button>`:`<button class="btn dark" disabled>Nomor WA kosong</button>`}</div><div class="tablewrap"><table><thead><tr><th>Nota</th><th>Tanggal</th><th>Produk</th><th>Total</th><th>DP</th><th>Sisa</th></tr></thead><tbody>${p.rows.sort((a,b)=>date(a).localeCompare(date(b))).map(d=>`<tr><td>${esc(d.nomorNota||d.nota||d.id)}</td><td>${esc(fmtDate(date(d)))}</td><td>${esc(products(d))}</td><td>${money(Math.max(0,total(d)-diskon(d)))}</td><td>${money(dp(d))}</td><td><b>${money(sisa(d))}</b></td></tr>`).join('')}</tbody></table></div><div class="total">TOTAL TAGIHAN: ${money(sum)}</div></article>`}).join('')}
async function load(){if(!ownerUid)return;$('msg').textContent='Mengambil data penjualan dari Firebase...';try{let snap;try{snap=await getDocsFromServer(query(collection(db,'penjualan'),where('ownerUid','==',ownerUid)))}catch(e){snap=await getDocs(query(collection(db,'penjualan'),where('ownerUid','==',ownerUid)))}all=snap.docs.map(x=>({id:x.id,...x.data()}));$('msg').textContent=`Data penjualan berhasil dimuat: ${all.length} transaksi.`;render()}catch(e){$('results').innerHTML=`<div class="err">Gagal membaca data penjualan: ${esc(e.message||e)}\nPeriksa aturan Firestore dan pastikan data penjualan memiliki field ownerUid yang sesuai.</div>`;$('msg').textContent='Gagal memuat data.';$('summary').textContent='Ringkasan belum tersedia.'}}
$('filterBtn').addEventListener('click',render);$('search').addEventListener('input',render);$('from').addEventListener('change',render);$('to').addEventListener('change',render);$('reloadBtn').addEventListener('click',load);
onAuthStateChanged(auth,async u=>{if(!u){location.replace('login.html');return}try{const us=await getDoc(doc(db,'users',u.uid));if(!us.exists())throw Error('Profil pengguna tidak ditemukan.');const p=us.data()||{},role=String(p.role||'').toLowerCase();ownerUid=(role==='owner'||role==='superadmin')?u.uid:String(p.ownerUid||'').trim();if(!ownerUid)throw Error('Owner UID tidak ditemukan pada profil akun.');$('accountLine').textContent=`${u.email||'Akun'} • ${p.role||'-'} • Owner ${ownerUid.slice(0,6)}`;await load()}catch(e){$('msg').innerHTML=`<span class="err">Gagal memuat akun: ${esc(e.message||e)}</span>`;$('results').innerHTML=''}});
</script></body></html>
