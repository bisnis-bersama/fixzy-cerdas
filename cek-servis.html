<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0f14">
<title>A YUDI THEA | Cek Status Servis</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef2f6;color:#111827;font-family:Arial,sans-serif}.head{background:#0b0f14;color:#fff;border-bottom:4px solid #ffc107;padding:18px 14px;text-align:center}.head b{color:#ffc107}.wrap{max-width:560px;margin:20px auto;padding:0 12px}.card{background:#fff;border:2px solid #111827;border-radius:22px;padding:20px;margin-bottom:14px;box-shadow:5px 5px 0 #111827}.title{font-weight:900;font-size:24px;margin:0 0 16px}.row{display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid #e5e7eb;font-size:14px}.row:last-child{border-bottom:0}.row span.label{color:#64748b}.row b{text-align:right;max-width:62%;overflow-wrap:anywhere}.status{display:inline-block;background:#ffc107;color:#111827;padding:7px 11px;border-radius:999px;font-weight:900}.muted{font-size:14px;line-height:1.6;color:#64748b}button{width:100%;padding:15px;border:2px solid #111827;border-radius:13px;background:#ffc107;font-weight:900;font-size:15px;box-shadow:3px 3px 0 #111827;cursor:pointer;margin-top:8px}.error{color:#b91c1c;font-weight:800;line-height:1.5}.success{color:#166534;font-weight:700}
</style>
</head>
<body>
<header class="head">
  <div style="font-size:22px;font-weight:900">A YUDI THEA <b>CEK SERVIS</b></div>
  <div style="font-size:15px;margin-top:7px">Software &amp; Hardware Solution</div>
  <div style="font-size:13px;margin-top:5px">Depan Pasar Hewan, Blok Jum'at, Maja Utara, Maja, Majalengka</div>
</header>
<main class="wrap">
  <section class="card">
    <h1 class="title">Status Servis Anda</h1>
    <p id="loading" class="muted">Memuat data servis...</p>
    <div id="detail" hidden></div>
    <p id="err" class="error" role="alert"></p>
    <button onclick="location.href='scan-barcode.html'">SCAN / CEK NOTA LAIN</button>
  </section>
  <p class="muted">Informasi pelanggan ditampilkan untuk membantu pengecekan nota. IMEI, sandi, dan pola kunci tidak ditampilkan.</p>
</main>
<script type="module">
import { initializeApp, getApps, getApp } from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import { getFirestore, doc, getDoc } from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';

const cfg = {
  apiKey: 'AIzaSyC_PcarMTT5Un7qfSLzf92o5OGn5rginsI',
  authDomain: 'fixzy-update.firebaseapp.com',
  projectId: 'fixzy-update',
  storageBucket: 'fixzy-update.firebasestorage.app',
  messagingSenderId: '995892519622',
  appId: '1:995892519622:web:fa41047944d8e5b35d6dc7'
};
const app = getApps().length ? getApp() : initializeApp(cfg);
const db = getFirestore(app);
const $ = id => document.getElementById(id);
const safe = v => String(v ?? '-').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = v => 'Rp ' + (Number(v) || 0).toLocaleString('id-ID');
function row(label, value) { return `<div class="row"><span class="label">${safe(label)}</span><b>${safe(value)}</b></div>`; }

// Ambil 4 digit terakhir dari nomor nota, termasuk jika QR berisi URL atau ID SRV panjang.
function lastFourNota(value) {
  let s = String(value ?? '').trim();
  if (!s) return '';
  try {
    if (/^https?:\/\//i.test(s)) {
      const u = new URL(s);
      const param = u.searchParams.get('nota') || u.searchParams.get('nomorNota') || u.searchParams.get('no');
      if (param) s = param;
      else s = decodeURIComponent(u.pathname.split('/').filter(Boolean).pop() || s);
    }
  } catch (_) {}
  const digits = s.match(/\d+/g);
  if (!digits || !digits.length) return '';
  // Jika input berupa nomor/ID nota, empat digit paling akhir adalah nomor pendek yang dicetak.
  return digits.join('').slice(-4);
}
async function findPublicServis(rawInput) {
  const short=lastFourNota(rawInput);
  if(!/^\d{4}$/.test(short)) return null;
  // Hanya baca satu dokumen yang diminta. Tidak melakukan list/query seluruh koleksi.
  const snap=await getDoc(doc(db,'cek_servis_public',short));
  return snap.exists() ? snap : null;
}

async function load() {
  const params = new URLSearchParams(location.search);
  const rawNota = String(params.get('nota') || params.get('nomorNota') || params.get('no') || '').trim();
  if (!rawNota) {
    $('loading').textContent = 'Nomor nota belum diisi.';
    $('err').textContent = 'Silakan scan QR nota yang benar atau masukkan nomor nota.';
    return;
  }
  const short = lastFourNota(rawNota);
  try {
    const snap = await findPublicServis(rawNota);
    $('loading').hidden = true;
    if (!snap) {
      $('err').textContent = `Nota ${short || rawNota} belum ditemukan di koleksi cek_servis_public. Pastikan ringkasan nota sudah disimpan ke koleksi publik dan nomorNota berisi nomor yang sesuai.`;
      return;
    }
    const d = snap.data() || {};
    $('err').textContent = '';
    $('detail').hidden = false;
    $('detail').innerHTML = `
      ${row('Nomor Nota', lastFourNota(d.nomorNota || d.nota || snap.id) || short)}
      ${row('Tanggal', d.tanggal || d.tanggalMasuk || '-')}
      ${row('Nama Pelanggan', d.pelanggan?.nama || d.namaPelanggan || d.nama || '-')}
      ${row('Nomor WhatsApp', d.pelanggan?.wa || d.pelanggan?.noWa || d.noWa || d.wa || d.nomorWa || '-')}
      ${row('Alamat Pelanggan', d.pelanggan?.alamat || d.alamatPelanggan || d.alamat || '-')}
      ${row('Tanggal Servis', d.tanggal || d.tanggalMasuk || '-')}
      ${row('Nama Konter', d.namaKonter || 'A YUDI THEA')}
      ${row('Merek dan Tipe HP', d.brandTipe || d.servisan?.brandTipe || d.merekTipe || '-')}
      ${row('Keluhan', d.jenisKerusakan || d.servisan?.jenisKerusakan || d.keluhan || '-')}
      ${row('Teknisi', d.namaTeknisi || d.teknisi || '-')}
      <div class="row"><span class="label">Status</span><b><span class="status">${safe(d.status || 'Dalam proses')}</span></b></div>
      ${row('Estimasi Biaya', money(d.estimasiBiaya))}
      ${row('DP', money(d.dp))}
      ${row('Sisa Pembayaran', money(d.sisa ?? d.sisaPembayaran))}
    `;
  } catch (e) {
    console.error('Gagal memuat status servis:', e);
    $('loading').hidden = true;
    $('err').textContent = 'Status servis gagal dimuat. Periksa koneksi internet dan aturan baca Firebase untuk koleksi cek_servis_public.';
  }
}
load();
</script>
</body>
</html>
