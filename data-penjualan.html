function normalizeReplacement(rows,source){if(!rows.length)return[];const clean=s=>String(s??'').trim().toLowerCase().replace(/[\s_\-()./]+/g,'');let hs=rows[0].map(clean),out=[];for(let i=1;i<rows.length;i++){let r=rows[i],get=keys=>{for(const k of keys){let ix=hs.indexOf(clean(k));if(ix>=0&&String(r[ix]??'').trim())return r[ix]}return''};let nama=get(['nama barang','nama produk','nama','produk','product','barang'])||r[1]||r[0];if(!String(nama||'').trim())continue;out.push({id:source+'-'+i,nama:String(nama).trim(),kode:get(['kode','sku','kode produk','id']),supplier:get(['supplier','suplier','nama supplier'])||source,modal:productNum(get(['modal','harga modal','harga beli','hpp'])||r[3]),jual:productNum(get(['jual','harga jual','harga penjualan'])||r[4]),stok:productNum(get(['stock','stok','sisa stok','jumlah stok'])||r[6])})}return out}
function replacementCsvUrl(raw){try{let u=new URL(raw);if(!u.hostname.toLowerCase().includes('docs.google.com')||!u.pathname.includes('/spreadsheets/'))return raw;let gid=u.searchParams.get('gid')||'0',pub=u.pathname.match(/\/spreadsheets\/d\/e\/([^/]+)\/pub(?:html)?/i);if(pub)return `https://docs.google.com/spreadsheets/d/e/${pub[1]}/pub?gid=${encodeURIComponent(gid)}&single=true&output=csv`;let id=u.pathname.match(/\/spreadsheets\/d\/([^/]+)/i);return id?`https://docs.google.com/spreadsheets/d/${id[1]}/export?format=csv&gid=${encodeURIComponent(gid)}`:raw}catch(e){return raw}}
async function loadReplacementProducts(){const info=$('replacementInfo'),btn=$('loadReplacementProducts');btn.disabled=true;info.textContent='Memuat link spreadsheet...';try{const snap=await getDoc(doc(db,'pengaturan_spreadsheet',uid));if(!snap.exists())throw Error('Pengaturan Spreadsheet tidak ditemukan untuk akun ini.');const cfg=snap.data()||{};let links=Array.isArray(cfg.spreadsheetLinks)?cfg.spreadsheetLinks:[];if(!links.length&&cfg.spreadsheetUrl)links=[cfg.spreadsheetUrl];if(!links.length)throw Error('Link Spreadsheet belum tersimpan.');let found=[],errors=[];for(let i=0;i<links.length;i++){try{const res=await fetch(replacementCsvUrl(links[i]),{cache:'no-store'});if(!res.ok)throw Error('HTTP '+res.status);const txt=await res.text();if(/<html|<!doctype/i.test(txt.slice(0,400)))throw Error('Sheet belum dipublikasikan sebagai CSV');found.push(...normalizeReplacement(parseProductCSV(txt),'Spreadsheet '+(i+1)))}catch(e){errors.push('Sheet '+(i+1)+': '+e.message)}}replacementProducts=found;info.textContent=`${found.length} produk dimuat${errors.length?' • '+errors.join('; '):''}`;renderReplacementResults()}catch(e){info.textContent='Gagal memuat produk: '+(e.message||e)}finally{btn.disabled=false}}
function refreshReplacementLines(){const lines=$('edProduk').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean),sel=$('replacementLine'),old=Number(sel.value)||0;sel.innerHTML=lines.map((x,i)=>`<option value="${i}">Produk ${i+1}: ${esc(x.slice(0,55))}</option>`).join('')||'<option value="0">Produk 1</option>';sel.value=String(Math.min(old,Math.max(0,lines.length-1)))}
function renderReplacementResults(){const q=$('replacementSearch').value.trim().toLowerCase(),box=$('replacementResults');if(q.length<2){box.innerHTML='';return}const list=replacementProducts.filter(p=>(p.nama+' '+p.kode+' '+p.supplier).toLowerCase().includes(q)).slice(0,40);box.innerHTML=list.map(p=>`<button type="button" class="replacement-item" data-product-id="${esc(p.id)}"><b>${esc(p.nama)}</b><small>${esc(p.supplier)} • Tunai ${money(p.modal)} • Tempo ${money(p.jual)} • Stok ${p.stok}</small></button>`).join('')||'<div class="muted">Produk tidak ditemukan.</div>';box.querySelectorAll('[data-product-id]').forEach(b=>b.addEventListener('click',()=>replaceProduct(b.dataset.productId)))}
function replaceProduct(id){const p=replacementProducts.find(x=>x.id===id);if(!p)return;const lines=$('edProduk').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);const ix=Number($('replacementLine').value)||0;const line=`${p.nama}`;if(lines.length){lines[ix]=line}else lines.push(line);$('edProduk').value=lines.join('\n');refreshReplacementLines();$('replacementLine').value=String(Math.min(ix,Math.max(0,lines.length-1)));$('replacementInfo').textContent=`Produk diganti menjadi: ${p.nama}. Sesuaikan Total (Rp) jika harga berubah.`;$('replacementResults').innerHTML=''}
$('loadReplacementProducts').addEventListener('click',loadReplacementProducts);$('replacementSearch').addEventListener('input',renderReplacementResults);$('edProduk').addEventListener('input',refreshReplacementLines);
function closeEdit(){$('editModal').classList.remove('show');editingId=''}
window.editTransaction=openEdit;window.markLunas=async id=>{const d=all.find(x=>x.id===id);if(!d||status(d)!=='tagihan')return;if(!confirm(`Tandai nota ${d.nomorNota||d.nota||id} sebagai LUNAS? Status transaksi akan berubah menjadi Lunas.`))return;try{await updateDoc(doc(db,'penjualan',id),{status:'lunas',sisa:0,pendapatan:Math.max(0,total(d)-diskon(d)),lunasAt:serverTimestamp(),updatedAt:serverTimestamp(),ownerUid:ownerUid,ownerId:ownerUid});$('msg').textContent=`Nota ${d.nomorNota||d.nota||id} berhasil ditandai Lunas.`;await load()}catch(e){alert('Gagal mengubah status menjadi Lunas: '+(e.message||e))}};
$('saveEdit').addEventListener('click',async()=>{if(!editingId)return;const btn=$('saveEdit');btn.disabled=true;$('editMsg').textContent='Menyimpan perubahan...';try{const ref=doc(db,'penjualan',editingId),snap=await getDoc(ref);if(!snap.exists())throw Error('Transaksi tidak ditemukan di Firebase.');const current=snap.data()||{};if(String(current.ownerUid||current.ownerId||'')!==String(ownerUid))throw Error('Transaksi ini bukan milik owner yang sedang aktif.');const nt=Math.max(0,Number($('edTotal').value)||0),dis=Math.max(0,Number($('edDiskon').value)||0),paid=Math.max(0,Number($('edDp').value)||0),st=$('edStatus').value,wa=$('edWa').value.trim(),customer=$('edNama').value.trim()||'Pelanggan',nota=$('edNota').value.trim()||current.nomorNota||current.nota||editingId;let s=st==='tagihan'?Math.max(0,nt-dis-paid):0;const patch={tanggal:$('edTanggal').value||date(current),nomorNota:nota,nota, namaPelanggan:customer,noHp:wa,noWhatsapp:wa,wa,items:$('edProduk').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean),total:nt,diskon:dis,dp:paid,sisa:s,status:st,pendapatan:['lunas','tunai'].includes(st)?Math.max(0,nt-dis):st==='tagihan'?Math.min(paid,Math.max(0,nt-dis)):0,updatedAt:serverTimestamp(),ownerUid,ownerId:ownerUid};if(current.pelanggan&&typeof current.pelanggan==='object')patch.pelanggan={...current.pelanggan,nama:customer,wa};await updateDoc(ref,patch);closeEdit();$('msg').textContent='Perubahan transaksi berhasil disimpan.';await load()}catch(e){$('editMsg').textContent='Gagal menyimpan: '+(e.message||e)}finally{btn.disabled=false}});
$('cancelEdit').addEventListener('click',closeEdit);$('editModal').addEventListener('click',e=>{if(e.target===$('editModal'))closeEdit()});$('filterBtn').addEventListener('click',render);$('search').addEventListener('input',render);$('from').addEventListener('change',render);$('to').addEventListener('change',render);$('reloadBtn').addEventListener('click',load);

function applyDarkMode(on){document.body.classList.toggle('dark-mode',on);darkModeBtn.textContent=on?'☀️ Mode Terang':'🌙 Mode Gelap';darkModeBtn.setAttribute('aria-pressed',String(on));try{localStorage.setItem('fixzy-tagihan-dark-mode',on?'1':'0')}catch(e){}}

onAuthStateChanged(auth,async u=>{if(!u){location.replace('login.html');return}try{uid=u.uid;const us=await getDoc(doc(db,'users',u.uid));if(!us.exists())throw Error('Profil pengguna tidak ditemukan.');const p=us.data()||{},role=String(p.role||'').toLowerCase();ownerUid=(role==='owner'||role==='superadmin'||p.isOwner===true)?u.uid:String(p.ownerUid||'').trim();if(!ownerUid)throw Error('Owner UID tidak ditemukan pada profil akun.');let op=p;if(ownerUid!==uid){const os=await getDoc(doc(db,'users',ownerUid));if(os.exists())op=os.data()||{}}ownerLabel=op.namaOwner||op.ownerName||op.namaKonter||op.namaToko||op.namaUsaha||op.displayName||op.nama||op.name||op.businessName||op.email||'Owner';$('accountLine').textContent=`Owner: ${ownerLabel} • Akun: ${u.email||'pengguna'}`;await load()}catch(e){$('msg').innerHTML=`<span class="err">Gagal memuat akun: ${esc(e.message||e)}</span>`;$('results').innerHTML='';$('summary').textContent='Ringkasan belum tersedia.'}});
