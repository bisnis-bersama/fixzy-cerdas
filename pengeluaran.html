</style></head><body>
<header class="header"><img src="logo.png" class="logo" alt="FIXZY"><div class="brand"><h1 id="konterNameHeader">Memuat nama konter...</h1><p>FIXZY • DATA PENGELUARAN</p></div><div class="owner"><b id="ownerName">Memuat...</b><span id="ownerEmail">Firebase</span></div><button class="refresh" onclick="muatSemua()" title="Refresh">↻</button><button id="darkToggle" class="dark-toggle" onclick="toggleDark()" title="Mode Gelap">🌙</button></header>
<main class="wrap"><div id="status" class="status" style="display:none">Memeriksa sesi Firebase...</div>
<section class="kpis"><div class="kpi k1"><small>TOTAL PENGELUARAN</small><b id="total">Rp 0</b></div><div class="kpi k2"><small>KASBON KARYAWAN</small><b id="kasbon">Rp 0</b></div><div class="kpi k3"><small>PENGELUARAN LAIN</small><b id="lain">Rp 0</b></div><div class="kpi k4"><small>TRANSAKSI</small><b id="jumlah">0</b></div></section>
<section class="card" style="margin-top:12px"><h2 class="title" id="formTitle">➕ Tambah Data Pengeluaran</h2><div class="formgrid"><div class="field"><label>TANGGAL</label><input id="tanggal" type="date"></div><div class="field"><label>JENIS PENGELUARAN</label><select id="jenis" onchange="ubahJenis()"><option>Konsumsi</option><option>Kasbon Karyawan</option><option>Pembayaran</option><option>Belanja</option><option>Lain Lain</option></select></div><div class="field" id="karyawanField" style="display:none"><small id="karyawanStatus" style="font-size:10px;color:#64748b">Memuat karyawan...</small><label>KARYAWAN</label><select id="karyawan"><option value="">Pilih karyawan</option></select></div><div class="field"><label>NOMINAL</label><input id="nominal" type="number" min="1" inputmode="numeric" placeholder="Contoh: 50000"></div><div class="field full"><label>KETERANGAN</label><textarea id="keterangan" placeholder="Contoh: makan karyawan, bayar listrik, belanja sparepart, kasbon, dll."></textarea></div></div><div class="actions"><button class="btn primary" id="saveBtn" onclick="simpan()">💾 Simpan</button><button class="btn save-edit" id="cancelEditBtn" style="display:none" onclick="batalEdit()">✖ Batal Edit</button><button class="btn light" onclick="bersihkan()">Bersihkan</button></div></section>
<section class="card"><div class="filterbar"><div class="field"><label>FILTER BULAN</label><input id="filterBulan" type="month" onchange="render()"></div><button class="btn dark" onclick="muatSemua()">↻ Refresh Data</button></div></section>
<section class="card"><h2 class="title">📒 Riwayat Pengeluaran</h2><div class="table-wrap"><table><thead><tr><th>No</th><th>Tanggal</th><th>Jenis</th><th>Karyawan</th><th>Keterangan</th><th class="num">Nominal</th><th>Aksi</th></tr></thead><tbody id="tbody"></tbody></table></div></section></main>
<div class="popup-bg" id="popup"><div class="popup"><h2 id="popupTitle">FIXZY</h2><p id="popupText"></p><div class="popup-actions"><button style="background:#e2e8f0;color:#111" onclick="tutupPopup()">Tutup</button><button style="background:#081326;color:#fff" onclick="tutupPopup()">OK</button></div></div></div>
<script type="module">
import{initializeApp,getApps,getApp}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";import{getAuth,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";import{getFirestore,collection,getDocs,getDoc,doc,query,where,addDoc,updateDoc,deleteDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
const cfg={apiKey:"AIzaSyC_PcarMTT5Un7qfSLzf92o5OGn5rginsI",authDomain:"fixzy-update.firebaseapp.com",projectId:"fixzy-update",storageBucket:"fixzy-update.firebasestorage.app",messagingSenderId:"995892519622",appId:"1:995892519622:web:fa41047944d8e5b35d6dc7"};const app=getApps().length?getApp():initializeApp(cfg),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id);
function applyDarkMode(){const d=localStorage.getItem("fixzy_dark_mode")==="1";document.body.classList.toggle("dark",d);$('darkToggle').textContent=d?"☀️":"🌙";$('darkToggle').title=d?"Mode Terang":"Mode Gelap"}window.toggleDark=()=>{const d=!document.body.classList.contains("dark");document.body.classList.toggle("dark",d);localStorage.setItem("fixzy_dark_mode",d?"1":"0");applyDarkMode()};applyDarkMode();
let uid="",ownerUid="",profile={},namaKonter="",rows=[],employees=[],editId=null;const money=v=>"Rp "+(Number(v)||0).toLocaleString("id-ID"),esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}function monthNow(){return today().slice(0,7)}function showPopup(t,m){$('popupTitle').textContent=t;$('popupText').textContent=m;$('popup').classList.add('show')}window.tutupPopup=()=>$('popup').classList.remove('show');function ubahJenis(){$('karyawanField').style.display=$('jenis').value==="Kasbon Karyawan"?"flex":"none"}window.ubahJenis=ubahJenis;
function resetForm(){editId=null;$('formTitle').textContent="➕ Tambah Data Pengeluaran";$('saveBtn').textContent="💾 Simpan";$('cancelEditBtn').style.display="none";$('tanggal').value=today();$('jenis').value="Konsumsi";$('nominal').value="";$('keterangan').value="";$('karyawan').value="";ubahJenis()}window.batalEdit=resetForm;window.bersihkan=()=>{if(editId){resetForm();return}$('tanggal').value=today();$('jenis').value="Konsumsi";$('nominal').value="";$('keterangan').value="";$('karyawan').value="";ubahJenis()};
async function ambilProfile(){if(!uid)return;profile={};try{const s=await getDoc(doc(db,"users",uid));if(s.exists())profile=s.data()||{}}catch(e){console.warn(e)}ownerUid=profile.ownerUid||profile.ownerId||uid;namaKonter=String(profile.namaKonter||profile.konterName||profile.namaToko||profile.namaUsaha||profile.toko||profile.konter||"").trim();if(!namaKonter&&ownerUid!==uid){try{const s=await getDoc(doc(db,"users",ownerUid));if(s.exists()){const p=s.data()||{};namaKonter=String(p.namaKonter||p.konterName||p.namaToko||p.namaUsaha||p.toko||p.konter||"").trim()}}catch(e){}}if(!namaKonter&&auth.currentUser?.email){try{const s=await getDocs(query(collection(db,"users"),where("email","==",auth.currentUser.email)));if(!s.empty){const p=s.docs[0].data()||{};namaKonter=String(p.namaKonter||p.konterName||p.namaToko||p.namaUsaha||p.toko||p.konter||"").trim()}}catch(e){}}$('konterNameHeader').textContent=namaKonter||"Nama Konter";$('ownerName').textContent=profile.nama||profile.namaPemilik||profile.namaLengkap||auth.currentUser?.displayName||"Akun FIXZY";$('ownerEmail').textContent=auth.currentUser?.email||"Firebase"}
async function ambilKaryawan(){employees=[];const map=new Map();for(const src of ["users","karyawan","employees"]){try{const s=src==="users"?await getDocs(query(collection(db,"users"),where("ownerUid","==",ownerUid))):await getDocs(collection(db,src));s.docs.forEach(d=>{const x={id:d.id,...d.data()},role=String(x.role||x.jabatan||x.posisi||"").toLowerCase(),inactive=["nonaktif","non aktif","inactive","disabled","hapus","deleted"].includes(String(x.status||"aktif").toLowerCase()),ownerMatch=!ownerUid||x.ownerUid===ownerUid||x.ownerId===ownerUid||x.pemilikUid===ownerUid||x.pemilikId===ownerUid||x.uidOwner===ownerUid||x.idOwner===ownerUid||x.konterUid===ownerUid||x.konterId===ownerUid,ok=!inactive&&ownerMatch&&(src!=="users"||["employee","karyawan","kasir","kurir","teknisi","reseller","staff","staf"].includes(role));if(ok){const n=String(x.nama||x.namaKaryawan||x.namaLengkap||x.name||x.displayName||x.email||"").trim();if(n)map.set(String(x.uid||x.id||n),{...x,_nama:n})}})}catch(e){console.warn(src,e.message)}}employees=[...map.values()].sort((a,b)=>a._nama.localeCompare(b._nama,"id"));$('karyawan').innerHTML='<option value="">Pilih karyawan</option>';employees.forEach(e=>{const o=document.createElement('option');o.value=e.id||e.uid||"";o.textContent=e._nama;o.dataset.name=e._nama;o.dataset.uid=e.uid||e.id||"";$('karyawan').appendChild(o)});$('karyawanStatus').textContent=employees.length?`${employees.length} karyawan tersedia`:"Karyawan belum ditemukan di Firebase";$('karyawanStatus').style.color=employees.length?"#15803d":"#b91c1c"}
async function ambilData(){const map=new Map();for(const f of ["ownerUid","uid"]){const v=f==="ownerUid"?ownerUid:uid;if(!v)continue;try{const s=await getDocs(query(collection(db,"pengeluaran"),where(f,"==",v)));s.docs.forEach(d=>map.set(d.id,{id:d.id,...d.data()}))}catch(e){console.warn("pengeluaran",f,e.message)}}rows=[...map.values()]}
function render(){const period=$('filterBulan').value||monthNow(),data=rows.filter(r=>String(r.tanggal||"").startsWith(period)).sort((a,b)=>String(b.tanggal||"").localeCompare(String(a.tanggal||""))),total=data.reduce((s,r)=>s+(Number(r.nominal)||0),0),kasbon=data.filter(r=>String(r.jenis||"").toLowerCase()==="kasbon karyawan").reduce((s,r)=>s+(Number(r.nominal)||0),0);$('total').textContent=money(total);$('kasbon').textContent=money(kasbon);$('lain').textContent=money(total-kasbon);$('jumlah').textContent=data.length;$('tbody').innerHTML=data.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.tanggal||"-")}</td><td><span class="badge">${esc(r.jenis||"-")}</span></td><td>${esc(r.namaKaryawan||"-")}</td><td>${esc(r.keterangan||"-")}</td><td class="num amount">${money(r.nominal)}</td><td><div class="actions" style="margin:0;flex-wrap:nowrap"><button class="btn edit-btn" onclick="editPengeluaran('${r.id}')">✏️ Edit</button><button class="btn danger" onclick="hapusPengeluaran('${r.id}')">🗑️ Hapus</button></div></td></tr>`).join("")||'<tr><td colspan="7" class="empty">Belum ada pengeluaran pada bulan ini.</td></tr>'}
window.editPengeluaran=id=>{const r=rows.find(x=>x.id===id);if(!r){showPopup("Data tidak ditemukan","Muat ulang data lalu coba lagi.");return}editId=id;$('formTitle').textContent="✏️ Edit Data Pengeluaran";$('saveBtn').textContent="💾 Simpan Perubahan";$('cancelEditBtn').style.display="inline-block";$('tanggal').value=r.tanggal||today();$('jenis').value=r.jenis||"Konsumsi";$('nominal').value=Number(r.nominal)||"";$('keterangan').value=r.keterangan||"";ubahJenis();if(r.karyawanId){if(!$('karyawan').querySelector(`option[value="${CSS.escape(r.karyawanId)}"]`)){const o=document.createElement('option');o.value=r.karyawanId;o.textContent=r.namaKaryawan||"Karyawan tersimpan";o.dataset.name=r.namaKaryawan||"";o.dataset.uid=r.karyawanUid||"";$('karyawan').appendChild(o)}$('karyawan').value=r.karyawanId}window.scrollTo({top:0,behavior:"smooth"})};
async function simpan(){if(!uid){showPopup("Sesi Firebase belum tersedia","Buka halaman ini dari aplikasi FIXZY yang sudah login.");return}const tanggal=$('tanggal').value||today(),jenis=$('jenis').value,nominal=Number($('nominal').value||0),keterangan=$('keterangan').value.trim();if(!nominal||nominal<1){showPopup("Nominal belum diisi","Masukkan nominal pengeluaran terlebih dahulu.");return}let karyawanId="",namaKaryawan="",karyawanUid="";if(jenis==="Kasbon Karyawan"){const o=$('karyawan').selectedOptions[0];karyawanId=$('karyawan').value;namaKaryawan=o?.dataset?.name||o?.textContent||"";karyawanUid=o?.dataset?.uid||"";if(!karyawanId){showPopup("Karyawan belum dipilih","Pilih karyawan untuk transaksi kasbon.");return}}const payload={tanggal,jenis,nominal,keterangan,karyawanId,namaKaryawan,karyawanUid,updatedAt:serverTimestamp(),updatedBy:uid};try{$('status').textContent=editId?"Memperbarui data...":"Menyimpan data...";if(editId){const r=rows.find(x=>x.id===editId);if(!r)throw Error("Data yang diedit tidak ditemukan.");await updateDoc(doc(db,"pengeluaran",editId),payload)}else{await addDoc(collection(db,"pengeluaran"),{uid,ownerUid,email:auth.currentUser?.email||"",namaKonter:namaKonter||"",...payload,createdBy:uid,createdAt:serverTimestamp()})}const act=editId?"diperbarui":"disimpan";resetForm();await ambilData();render();$('status').innerHTML=`<span class="ok">✓ Pengeluaran berhasil ${act} • ${esc(jenis)} • ${money(nominal)}</span>`;showPopup("Berhasil",`Data pengeluaran ${jenis} sebesar ${money(nominal)} berhasil ${act}.`)}catch(e){console.error(e);$('status').innerHTML=`<span class="err">❌ Gagal: ${esc(e.message||e)}</span>`;showPopup("Gagal menyimpan/perbarui",e.message||String(e))}}window.simpan=simpan;
window.hapusPengeluaran=async id=>{const r=rows.find(x=>x.id===id);if(!r){showPopup("Data tidak ditemukan","Muat ulang data lalu coba lagi.");return}if(!confirm(`Yakin menghapus pengeluaran ini?\n\nTanggal: ${r.tanggal||"-"}\nJenis: ${r.jenis||"-"}\nNominal: ${money(r.nominal)}\nKeterangan: ${r.keterangan||"-"}\n\nData akan dihapus permanen dari Firebase.`))return;try{$('status').textContent="Menghapus data...";await deleteDoc(doc(db,"pengeluaran",id));rows=rows.filter(x=>x.id!==id);if(editId===id)resetForm();render();$('status').innerHTML='<span class="ok">✓ Data pengeluaran berhasil dihapus.</span>';showPopup("Berhasil dihapus",`Pengeluaran ${money(r.nominal)} telah dihapus.`)}catch(e){console.error(e);$('status').innerHTML=`<span class="err">❌ Gagal menghapus: ${esc(e.message||e)}</span>`;showPopup("Gagal menghapus",e.message||String(e))}};
async function muatSemua(){$('status').textContent="Memuat data Firebase...";try{await ambilProfile();await ambilKaryawan();await ambilData();render();$('status').innerHTML=`<span class="ok">✓ Firebase aktif • ${rows.length} data pengeluaran • ${employees.length} karyawan • ${esc(namaKonter||"Nama Konter")}</span>`}catch(e){console.error(e);$('status').innerHTML=`<span class="err">❌ Gagal memuat Firebase: ${esc(e.message||e)}</span>`}}window.muatSemua=muatSemua;
$('tanggal').value=today();$('filterBulan').value=monthNow();ubahJenis();onAuthStateChanged(auth,async user=>{if(!user){uid="";$('ownerName').textContent="Menunggu sesi FIXZY...";$('ownerEmail').textContent="";$('status').innerHTML='<span class="err">⚠️ Sesi Firebase belum terbaca.</span><br><span class="status">Buka halaman ini dari index FIXZY yang sudah login.</span>';return}uid=user.uid;await muatSemua()});
