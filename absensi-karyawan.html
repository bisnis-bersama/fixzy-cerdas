<script type="module">
import {initializeApp,getApps,getApp} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import {getAuth,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,deleteDoc,collection,query,where,getDocsFromServer,serverTimestamp} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

const cfg={apiKey:"AIzaSyC_PcarMTT5Un7qfSLzf92o5OGn5rginsI",authDomain:"fixzy-update.firebaseapp.com",projectId:"fixzy-update",storageBucket:"fixzy-update.firebasestorage.app",messagingSenderId:"995892519622",appId:"1:995892519622:web:fa41047944d8e5b35d6dc7"};
const app=getApps().length?getApp():initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);
const $=id=>document.getElementById(id);
let uid="",ownerUid="",profile={},accounts=[],absensi=[],pengeluaran=[],selectedEmployee=null,selectedStatus="",currentRole="",isEmployeeView=false;
let debugLog=[];
function logD(msg){debugLog.push(msg); console.log("[ABSENSI]",msg); $("debugBox").style.display="block"; $("debugBox").textContent=debugLog.join("\n");}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
function money(n){return "Rp "+(Number(n)||0).toLocaleString("id-ID");}
function norm(v){return String(v??"").trim().toLowerCase();}
function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}
function monthNow(){return today().slice(0,7);}
function dateOf(x){return String(x.tanggal||x.date||x.tanggalAbsen||x.tanggalAbsensi||"").slice(0,10);}
function nama(a){return String(a.nama||a.namaKaryawan||a.namaLengkap||a.displayName||a.email||"").trim();}
function upahHarian(a){return Number(a.upahHarian??a.upah??a.gajiHarian??0)||0;}
function isHadir(x){const st=norm(x.status); return st==="hadir"||st==="masuk"||!!(x.jamMasuk||x.masuk||x.hadir===true||x.isHadir===true);}
function isLibur(x){return norm(x.status)==="libur";}
function isEmployeeRole(r){return ["employee","karyawan","kasir","kurir","teknisi","staff","user","pegawai"].includes(norm(r));}
function isOwnerRole(r){return ["owner","superadmin","admin","pemilik"].includes(norm(r));}
function sameEmployee(x,a){
 const fields=["userId","uid","karyawanUid","employeeUid","karyawanId","employeeId"];
 for(const f of fields){ if(x[f] && String(x[f])===String(a.id)) return true; }
 const an=norm(nama(a)), xn=norm(x.nama||x.namaKaryawan||x.karyawan||"");
 if(!an||!xn) return false;
 return an===xn||an.includes(xn)||xn.includes(an)||an.slice(0,3)===xn.slice(0,3);
}

async function loadProfile(user){
 const s=await getDoc(doc(db,"users",user.uid));
 if(!s.exists())throw new Error("Profil users/"+user.uid+" tidak ditemukan.");
 profile=s.data()||{};
 currentRole=norm(profile.role);
 logD(`Login role=${profile.role} nama=${nama(profile)} ownerUid=${profile.ownerUid||"-"} uid=${user.uid}`);
 if(isOwnerRole(currentRole)){
   ownerUid = (currentRole==="owner"||currentRole==="pemilik") ? user.uid : (profile.ownerUid||profile.ownerId||user.uid);
   isEmployeeView=false;
 } else if(isEmployeeRole(currentRole)){
   ownerUid = profile.ownerUid||profile.ownerId||profile.ownerKonterUid||user.uid;
   isEmployeeView=true;
 } else {
   throw new Error("Role '"+profile.role+"' tidak diizinkan. Harus owner/superadmin/employee/karyawan.");
 }
}

async function ownedUsers(){
 const map=new Map();
 if(isEmployeeView){
   try{
     const selfDoc=await getDoc(doc(db,"users",uid));
     if(selfDoc.exists()) map.set(uid,{id:uid,...selfDoc.data()});
     else map.set(uid,{id:uid,...profile});
   }catch{ map.set(uid,{id:uid,...profile}); }
   return [...map.values()];
 }
 for(const field of ["ownerUid","ownerId"]){
  try{const s=await getDocsFromServer(query(collection(db,"users"),where(field,"==",ownerUid)));s.docs.forEach(d=>map.set(d.id,{id:d.id,...d.data()}));}catch(e){logD(`users ${field} gagal ${e.message}`);}
 }
 try{const s=await getDoc(doc(db,"users",uid));if(s.exists())map.set(uid,{id:uid,...s.data()});}catch{}
 return [...map.values()].filter(x=>{
   const r=norm(x.role);
   return ["employee","karyawan","kasir","kurir","teknisi","staff","pegawai"].includes(r)||upahHarian(x)>0;
 }).sort((a,b)=>nama(a).localeCompare(nama(b),"id"));
}

async function ownedCollection(name){
 const map=new Map();
 const namaSaya=nama(profile);
 if(isEmployeeView){
   const tries=[
     {field:"ownerUid", value:ownerUid},
     {field:"ownerId", value:ownerUid},
     {field:"userId", value:uid},
     {field:"uid", value:uid},
     {field:"karyawanUid", value:uid},
     {field:"employeeUid", value:uid},
     {field:"karyawanId", value:uid},
     {field:"namaKaryawan", value:namaSaya},
     {field:"nama", value:namaSaya},
   ];
   for(const q of tries){
     if(!q.value) continue;
     try{
       const s=await getDocsFromServer(query(collection(db,name),where(q.field,"==",q.value)));
       let added=0;
       s.docs.forEach(d=>{
         // Untuk absensi, filter lagi by sameEmployee biar tidak kebaca data teman 1 owner yang nama mirip
         const data=d.data();
         if(name==="absensi"){
           if(sameEmployee(data,{id:uid,nama:namaSaya})){
             if(!map.has(d.id)){ map.set(d.id,{id:d.id,...data}); added++; }
           } else {
             // kalau query by ownerUid, kita tetap filter
             if(q.field==="ownerUid"||q.field==="ownerId"){
               if(sameEmployee(data,{id:uid,nama:namaSaya})){
                 if(!map.has(d.id)){ map.set(d.id,{id:d.id,...data}); added++; }
               }
             } else {
               if(!map.has(d.id)){ map.set(d.id,{id:d.id,...data}); added++; }
             }
           }
         } else {
           if(!map.has(d.id)){ map.set(d.id,{id:d.id,...data}); added++; }
         }
       });
       if(added>0) logD(`${name} query ${q.field}==${q.value} +${added}`);
     }catch(e){ logD(`${name} query ${q.field} gagal ${e.message}`); }
   }
 } else {
   for(const field of ["ownerUid","ownerId","uid"]){
    try{const s=await getDocsFromServer(query(collection(db,name),where(field,"==",ownerUid)));s.docs.forEach(d=>map.set(d.id,{id:d.id,...d.data()}))}catch(e){logD(`${name} ${field} gagal ${e.message}`)}
   }
 }
 logD(`${name} final=${map.size}`);
 return [...map.values()];
}

async function loadAll(){
 debugLog=[]; $("debugBox").style.display="none";
 [accounts,absensi,pengeluaran]=await Promise.all([ownedUsers(),ownedCollection("absensi"),ownedCollection("pengeluaran")])
}

function setupHeader(user){
 $("ownerName").textContent=profile.namaKonter||profile.nama||profile.namaKaryawan||user.displayName||"Akun FIXZY";
 $("ownerEmail").textContent=isEmployeeView ? `${profile.role} • ${user.email||""}` : (user.email||"Firebase");
 if(isEmployeeView){
   $("brandTitle").textContent="ABSENSI SAYA";
   $("brandSub").textContent="Absen pribadi • "+nama(profile);
   $("listTitle").textContent="📅 Riwayat Absensi Saya";
   $("employeeNotice").style.display="block";
   $("employeeNotice").innerHTML=`👋 Halo <b>${esc(nama(profile))}</b>! Kamu dalam mode karyawan. Kamu hanya bisa absen & lihat data milikmu sendiri. Data teman tidak akan muncul.`;
   const navSet=$("navSetting"); if(navSet) navSet.style.display="none";
   // lock dropdown
   $("employeeLabel").textContent="KARYAWAN (OTOMATIS)";
 } else {
   $("brandTitle").textContent="ABSENSI KARYAWAN";
   $("brandSub").textContent="Input • edit • status hadir/tidak hadir/libur • isolasi per konter";
 }
}

function alertBox(msg){$("status").innerHTML='<span class="err">❌ '+esc(msg)+'</span>';window.scrollTo({top:0,behavior:"smooth"})}
function setStatus(v){selectedStatus=String(v||"");const map={hadir:"hadirBtn",tidak_hadir:"tidakBtn",libur:"liburBtn"};Object.entries(map).forEach(([status,id])=>{const b=$(id);if(!b)return;const active=selectedStatus===status;b.classList.toggle("active",active);b.setAttribute("aria-pressed",active?"true":"false")})}
function employeeWa(a){return a.noWA||a.wa||a.noHp||a.whatsapp||a.nomorWa||""}function employeeWage(a){return upahHarian(a)}
function selectEmployee(){
 if(isEmployeeView){
   selectedEmployee=accounts[0]||null;
 } else {
   selectedEmployee=accounts.find(x=>x.id===$("employeeSelect").value)||null;
 }
 if(!selectedEmployee){$("wa").value="";$("upah").value="";return}
 $("wa").value=employeeWa(selectedEmployee);
 $("upah").value=money(employeeWage(selectedEmployee));
 loadExisting();
}

async function loadExisting(){
 if(!selectedEmployee)return;
 const id=`${selectedEmployee.id}_${$("tanggal").value||today()}`;
 try{
   const s=await getDoc(doc(db,"absensi",id));
   if(s.exists()){
     const x=s.data();
     setStatus(norm(x.status)||"tidak_hadir");
     $("catatan").value=x.catatan||"";
     logD(`loadExisting found ${id} status=${x.status}`);
   }else{
     setStatus("");$("catatan").value="";
   }
 }catch(e){logD(`loadExisting error ${e.message}`)}
}

async function saveAttendance(){
 if(!selectedEmployee)return alertBox("Pilih karyawan terlebih dahulu.");
 if(isEmployeeView && selectedEmployee.id!==uid) return alertBox("Mode karyawan: kamu hanya bisa absen untuk dirimu sendiri.");
 if(!selectedStatus)return alertBox("Pilih HADIR, TIDAK HADIR, atau LIBUR.");
 const tanggal=$("tanggal").value||today(),id=`${selectedEmployee.id}_${tanggal}`;
 const data={
   ownerUid,ownerId:ownerUid,
   userId:selectedEmployee.id,uid:selectedEmployee.id,karyawanUid:selectedEmployee.id,employeeUid:selectedEmployee.id,
   nama:nama(selectedEmployee),namaKaryawan:nama(selectedEmployee),
   email:selectedEmployee.email||"",role:selectedEmployee.role||"employee",
   jabatan:selectedEmployee.jabatan||selectedEmployee.posisi||"",
   noWA:employeeWa(selectedEmployee),upahHarian:employeeWage(selectedEmployee),
   tanggal,status:selectedStatus,hadir:selectedStatus==="hadir",
   catatan:$("catatan").value.trim(),updatedAt:serverTimestamp(),updatedBy:uid
 };
 try{
   $("saveBtn").disabled=true;$("saveBtn").textContent="Menyimpan...";
   await setDoc(doc(db,"absensi",id),data,{merge:true});
   logD(`Saved absensi ${id} status=${selectedStatus}`);
   await loadAll();render();setStatus(selectedStatus);
   $("status").innerHTML='<span class="ok">✓ Absensi berhasil disimpan.</span>';
 }catch(e){
   console.error("SAVE ERROR",e); logD(`SAVE GAGAL ${e.message}`);
   alertBox("Gagal menyimpan: "+(e?.message||e))
 }finally{$("saveBtn").disabled=false;$("saveBtn").textContent="💾 Simpan Absensi"}
}

function editAttendance(id){
 const x=absensi.find(a=>a.id===id);
 if(!x)return;
 if(isEmployeeView && !sameEmployee(x,{id:uid,nama:nama(profile)})) return alertBox("Tidak bisa edit data karyawan lain.");
 $("tanggal").value=x.tanggal||today();
 if(!isEmployeeView) $("employeeSelect").value=x.userId||x.uid||"";
 selectEmployee();
 setStatus(norm(x.status)||"tidak_hadir");
 $("catatan").value=x.catatan||"";
 window.scrollTo({top:0,behavior:"smooth"})
}

async function deleteAttendance(id){
 const x=absensi.find(a=>a.id===id);
 if(!x)return alertBox("Data absensi tidak ditemukan.");
 if(isEmployeeView){
   // karyawan tidak boleh hapus, hanya owner
   return alertBox("Mode karyawan tidak bisa hapus absensi. Hubungi owner.");
 }
 const recordOwner=x.ownerUid||x.ownerId||"";
 if(recordOwner!==ownerUid){alertBox("Penghapusan ditolak. Owner tidak cocok.");return}
 const namaKaryawan=x.nama||x.namaKaryawan||"Karyawan",tanggal=dateOf(x)||"-";
 if(!confirm(`HAPUS ABSENSI?\nNama: ${namaKaryawan}\nTanggal: ${tanggal}\nStatus: ${x.status||"-"}`))return;
 try{
   $("status").textContent="Menghapus...";
   await deleteDoc(doc(db,"absensi",id));
   absensi=absensi.filter(a=>a.id!==id);render();
   $("status").innerHTML='<span class="ok">✓ Data absensi berhasil dihapus.</span>';
 }catch(e){logD(`DELETE GAGAL ${e.message}`);alertBox("Gagal menghapus: "+(e?.message||e))}
}

function render(){
 const month=$("bulan").value||monthNow(),q=norm($("cari").value);
 let rows=absensi.filter(x=>dateOf(x).startsWith(month));
 if(isEmployeeView){
   rows=rows.filter(x=>sameEmployee(x,{id:uid,nama:nama(profile)}));
 } else {
   rows=rows.filter(x=>!q||norm(x.nama||x.namaKaryawan).includes(q)||norm(x.jabatan).includes(q));
 }
 rows=rows.sort((a,b)=>dateOf(b).localeCompare(dateOf(a)));
 $("karyawanCount").textContent=isEmployeeView ? "1" : accounts.length;
 $("hadir").textContent=rows.filter(isHadir).length;
 $("tidak").textContent=rows.filter(x=>!isHadir(x)&&!isLibur(x)).length;
 $("totalUpah").textContent=money(rows.filter(isHadir).reduce((s,x)=>s+Number(x.upahHarian||0),0));
 $("tbody").innerHTML=rows.map(x=>`<tr><td>${esc(dateOf(x))}</td><td><b>${esc(x.nama||x.namaKaryawan||"-")}</b></td><td>${esc(x.jabatan||"-")}</td><td><span class="status-pill ${isHadir(x)?"status-hadir":isLibur(x)?"status-libur":"status-tidak"}">${esc(x.status||"-")}</span></td><td>${isHadir(x)?money(x.upahHarian):"Rp 0"}</td><td>${esc(x.catatan||"-")}</td><td><div class="action-row"><button type="button" class="action edit" data-edit="${esc(x.id)}">✏️ Edit</button>${isEmployeeView?"":`<button type="button" class="action delete" data-delete="${esc(x.id)}">🗑️ Hapus</button>`}</div></td></tr>`).join("")||'<tr><td colspan="7" class="empty">Belum ada absensi pada bulan ini.</td></tr>';
}

async function refresh(){
 $("status").textContent="⏳ Membaca data Firebase...";
 try{
   await loadAll();
   const sel=$("employeeSelect");
   if(isEmployeeView){
     sel.innerHTML=`<option value="${esc(accounts[0]?.id||"")}">${esc(nama(accounts[0]||profile))} (Saya)</option>`;
     sel.value=accounts[0]?.id||""; sel.disabled=true;
     $("employeeField").style.opacity="0.7";
   } else {
     sel.innerHTML='<option value="">-- Pilih Karyawan --</option>'+accounts.map(a=>`<option value="${esc(a.id)}">${esc(nama(a))}</option>`).join("");
     sel.disabled=false;
   }
   selectEmployee();
   render();
   $("status").innerHTML=`<span class="ok">✓ Data absensi siap • ${isEmployeeView?"Mode Karyawan (Pribadi)":"Mode Owner"} • ${absensi.length} records</span>`;
 }catch(e){alertBox(e.message||e); logD(`refresh error ${e.message}`)}
}

$("tanggal").value=today();$("bulan").value=monthNow();
$("employeeSelect").onchange=selectEmployee;$("tanggal").onchange=loadExisting;
[["hadirBtn","hadir"],["tidakBtn","tidak_hadir"],["liburBtn","libur"]].forEach(([id,status])=>{
 const b=$(id);if(b){b.type="button";b.addEventListener("click",e=>{e.preventDefault();e.stopPropagation();setStatus(status)});b.addEventListener("touchend",e=>{e.preventDefault();setStatus(status)},{passive:false})}
});
$("saveBtn").addEventListener("click",e=>{e.preventDefault();saveAttendance()});
$("cari").oninput=render;$("bulan").onchange=refresh;$("refreshBtn").onclick=refresh;$("refresh2").onclick=refresh;
$("tbody").onclick=e=>{
 const edit=e.target.closest("[data-edit]");if(edit){editAttendance(edit.dataset.edit);return}
 const del=e.target.closest("[data-delete]");if(del)deleteAttendance(del.dataset.delete)
};
onAuthStateChanged(auth,async user=>{
 if(!user){$("status").innerHTML='<span class="err">❌ Sesi login tidak ditemukan.</span>';return}
 uid=user.uid;
 try{await loadProfile(user);setupHeader(user);await refresh()}catch(e){$("status").innerHTML='<span class="err">🔒 '+esc(e.message||e)+'</span>'; logD(`boot error ${e.message}`)}
});
</script>
