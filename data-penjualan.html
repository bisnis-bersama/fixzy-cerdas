<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0f14">
<title>FIXZY | Tagihan Pelanggan</title>
<style>
:root{--black:#0b0f14;--black2:#111827;--yellow:#ffc107;--line:#dbe2ea;--muted:#64748b}*{box-sizing:border-box}body{margin:0;background:#eef2f6;color:#111827;font-family:Arial,sans-serif}header{position:sticky;top:0;z-index:5;background:var(--black);color:white;border-bottom:5px solid var(--yellow);padding:13px 15px}header .in{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px}header .brand{display:flex;align-items:center;gap:11px;min-width:0}header .logo{width:56px;height:56px;object-fit:contain;border-radius:12px;background:#000;border:2px solid var(--yellow);padding:3px;flex:none}header .brand-text{min-width:0}header h1{font-size:20px;margin:0 0 5px}header small{color:#cbd5e1;line-height:1.4;overflow-wrap:anywhere}.wrap{max-width:1000px;margin:18px auto;padding:0 12px}.card{background:#fff;border:2px solid var(--black2);border-radius:20px;padding:16px;margin-bottom:16px;box-shadow:5px 5px 0 var(--black2)}.grid{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:10px}label{display:block;font-size:12px;font-weight:900;color:#475569;margin:0 0 6px}input,textarea,select{width:100%;min-height:44px;border:2px solid var(--black2);border-radius:11px;padding:10px;font:inherit;background:#fff;color:#111827}textarea{min-height:105px;resize:vertical}.btn{border:0;border-radius:11px;padding:12px 14px;font-weight:900;cursor:pointer;font-size:14px;line-height:1.2}.btn:disabled{opacity:.55;cursor:wait}.yellow{background:var(--yellow);color:#111827}.dark{background:var(--black2);color:white}.green{background:#16a34a;color:white}.blue{background:#dbeafe;color:#1d4ed8}.summary{background:var(--black2);color:white;border-radius:15px;padding:16px;line-height:1.75;margin-bottom:15px;font-size:16px}.summary b{color:var(--yellow)}.person{border:2px solid var(--black2);border-radius:17px;padding:14px;margin-top:12px;box-shadow:4px 4px 0 var(--black2)}.personhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.person h3{margin:0 0 4px;font-size:19px}.muted{color:var(--muted);font-size:13px;line-height:1.5}.sale-row{border:1px solid var(--line);border-radius:13px;padding:12px;margin:12px 0;background:#fff}.sale-top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:flex-start;margin-bottom:9px}.sale-nota{font-weight:900;overflow-wrap:anywhere}.sale-date{color:var(--muted);font-size:12px;margin-top:4px}.detail-label{font-size:12px;font-weight:900;color:#475569;margin:10px 0 5px}.product-lines{border-radius:9px;background:#f8fafc;padding:7px 10px;overflow-wrap:anywhere}.product-line{padding:6px 0;border-bottom:1px dashed #cbd5e1;line-height:1.45;overflow-wrap:anywhere}.product-line:last-child{border-bottom:0}.money-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}.money-cell{background:#f8fafc;border-radius:9px;padding:9px;min-width:0}.money-cell span{display:block;font-size:12px;color:#64748b;margin-bottom:4px}.money-cell b{display:block;overflow-wrap:anywhere}.sale-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.sale-actions .btn{flex:1;min-width:105px}.total{font-size:18px;font-weight:900;color:#b45309;margin:14px 0 4px}.err{color:#b91c1c;font-weight:800;white-space:pre-wrap}.empty{padding:18px;text-align:center;color:#64748b}.modal{display:none;position:fixed;inset:0;z-index:20;background:#0009;padding:16px;overflow:auto;align-items:center;justify-content:center}.modal.show{display:flex}.modal-box{width:min(640px,100%);background:#fff;border:2px solid var(--black2);border-radius:18px;padding:17px;box-shadow:6px 6px 0 var(--yellow);max-height:92vh;overflow:auto}.modal-box h2{margin:0 0 14px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.form-grid .full{grid-column:1/-1}.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}@media(max-width:650px){.grid{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.form-grid .full{grid-column:auto}.personhead .btn{width:100%}header h1{font-size:15px}header .logo{width:48px;height:48px}header .in{gap:7px;align-items:center}header .back-btn{max-width:112px;padding:10px 9px;font-size:11px;flex:none}.wrap{padding:0 10px}.card{padding:13px;border-radius:17px}.money-grid{gap:5px}.money-cell{padding:8px 6px}.money-cell b{font-size:12px}.sale-actions .btn{min-width:0;font-size:12px;padding:11px 8px}.summary{font-size:15px}.person{padding:11px}}
</style>
</head>
<body>
<header><div class="in"><div class="brand"><img class="logo" src="logo.png" alt="Logo FIXZY" onerror="this.onerror=null;this.style.background='#000';this.alt='FIXZY'"><div class="brand-text"><h1>FIXZY — TAGIHAN PELANGGAN</h1><small id="accountLine">Memuat nama owner...</small></div></div><button class="btn yellow back-btn" onclick="location.href='data-penjualan.html'">← Data Penjualan</button></div></header>
<main class="wrap">
<section class="card"><h2 style="margin:0 0 14px">Pencarian Tagihan</h2><div class="grid"><div><label>NAMA / NOMOR WHATSAPP</label><input id="search" placeholder="Cari nama atau nomor WA"></div><div><label>TANGGAL DARI</label><input id="from" type="date"></div><div><label>TANGGAL SAMPAI</label><input id="to" type="date"></div></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="btn yellow" id="filterBtn">🔎 Tampilkan Tagihan</button><button class="btn dark" id="reloadBtn">↻ Muat Ulang</button></div><p id="msg" class="muted">Tagihan diambil dari transaksi penjualan berstatus Tagihan dan sisa pembayaran lebih dari Rp0.</p></section>
<div id="summary" class="summary">Memuat ringkasan...</div><section class="card"><div id="results"><div class="empty">Memuat data...</div></div></section></main>
<div class="modal" id="editModal" role="dialog" aria-modal="true" aria-labelledby="editTitle"><div class="modal-box"><h2 id="editTitle">✏️ Edit Transaksi</h2><div class="form-grid">
<div><label>TANGGAL TRANSAKSI</label><input id="edTanggal" type="date"></div><div><label>NOMOR NOTA</label><input id="edNota"></div>
<div><label>NAMA PELANGGAN</label><input id="edNama"></div><div><label>NOMOR WHATSAPP</label><input id="edWa" inputmode="tel"></div>
<div class="full"><label>DETAIL PRODUK (SATU PRODUK PER BARIS)</label><textarea id="edProduk" placeholder="Masukkan satu nama produk per baris"></textarea></div>
<div><label>TOTAL (RP)</label><input id="edTotal" type="number" min="0"></div><div><label>DISKON (RP)</label><input id="edDiskon" type="number" min="0"></div><div><label>DP / DIBAYAR (RP)</label><input id="edDp" type="number" min="0"></div><div><label>STATUS</label><select id="edStatus"><option value="tagihan">Tagihan</option><option value="lunas">Lunas</option><option value="tunai">Tunai</option><option value="batal">Batal</option></select></div>
</div><div class="modal-actions"><button class="btn dark" id="cancelEdit">Batal</button><button class="btn yellow" id="saveEdit">💾 Simpan Perubahan</button></div><p id="editMsg" class="muted"></p></div></div>
<script type="module">
import{initializeApp,getApps,getApp}from'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import{getAuth,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
import{getFirestore,collection,query,where,getDocs,getDocsFromServer,doc,getDoc,updateDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';
const cfg={apiKey:'AIzaSyC_PcarMTT5Un7qfSLzf92o5OGn5rginsI',authDomain:'fixzy-update.firebaseapp.com',projectId:'fixzy-update',storageBucket:'fixzy-update.firebasestorage.app',messagingSenderId:'995892519622',appId:'1:995892519622:web:fa41047944d8e5b35d6dc7'};
const app=getApps().length?getApp():initializeApp(cfg),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id);let ownerUid='',uid='',ownerLabel='Owner',all=[],editingId='';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'Rp '+(Number(n)||0).toLocaleString('id-ID');
const name=d=>d.pelanggan?.nama||d.namaPelanggan||d.nama||'Pelanggan';
const phone=d=>d.noHp||d.noWhatsapp||d.whatsapp||d.pelanggan?.wa||d.hp||d.nomorWa||d.wa||'';
const date=d=>{let v=d.tanggal??d.tanggalPenjualan??d.createdAt??'';if(v&&typeof v==='object'&&v.toDate)v=v.toDate().toISOString();return String(v).slice(0,10)};
const total=d=>Number(d.total??d.totalBayar??0)||0,diskon=d=>Number(d.diskon??d.potongan??0)||0,dp=d=>Number(d.dp??d.uangMuka??0)||0;
const status=d=>String(d.status||'tagihan').toLowerCase();
const sisa=d=>['tunai','batal','lunas'].includes(status(d))?0:Math.max(0,Number(d.sisa??(total(d)-diskon(d)-dp(d)))||0);
function productList(d){let p=d.items??d.produkList??d.namaProduk??d.produk??d.barang??d.detailProduk;if(Array.isArray(p))return p.map(x=>{if(typeof x==='string')return x;const n=x?.nama||x?.namaProduk||x?.produk||x?.namaBarang||x?.name||'Produk';const q=Number(x?.qty??x?.jumlah??x?.quantity??1)||1;return q>1?`${n} × ${q}`:n}).filter(Boolean);if(p&&typeof p==='object')return Object.values(p).map(x=>typeof x==='string'?x:(x?.nama||x?.namaProduk||x?.produk||x?.namaBarang||x?.name||'Produk')).filter(Boolean);let t=String(p||'-').trim();return t.includes('\n')?t.split(/\r?\n/).map(x=>x.trim()).filter(Boolean):t.includes(',')?t.split(',').map(x=>x.trim()).filter(Boolean):[t]}
function fmtDate(v){if(!v)return'-';let p=String(v).split('-');return p.length===3?`${p[2]}-${p[1]}-${p[0]}`:v}
function normPhone(v){let n=String(v||'').replace(/\D/g,'');if(n.startsWith('0'))n='62'+n.slice(1);else if(n.startsWith('8'))n='62'+n;return n}
function filterData(){const q=$('search').value.trim().toLowerCase(),from=$('from').value,to=$('to').value;return all.filter(d=>status(d)==='tagihan'&&sisa(d)>0&&(!from||date(d)>=from)&&(!to||date(d)<=to)&&(!q||[name(d),phone(d),d.nomorNota,d.nota].join(' ').toLowerCase().includes(q)))}
function waMessage(person,rows,from,to){const customer=String(person.nama||'').trim().replace(/^kak\s+/i,'');const konter=rows.find(d=>d.namaKonter||d.konter)?.namaKonter||rows.find(d=>d.konter)?.konter||'A Yudi Thea';let lines=[`Halo Kak ${customer}, kami dari ${konter} ingin mengirimkan rekap tagihan penjualan, ya.`,`Periode: ${from?fmtDate(from):'awal data'} s.d. ${to?fmtDate(to):'hari ini'}.`,''];let sum=0;rows.forEach((d,i)=>{let left=sisa(d);sum+=left;lines.push(`${i+1}. Nota: ${d.nomorNota||d.nota||d.id}`,`   Tanggal: ${fmtDate(date(d))}`,'   Detail produk:',...productList(d).map((x,j)=>`      ${j+1}. ${x}`),`   Total: ${money(Math.max(0,total(d)-diskon(d)))}`,`   DP: ${money(dp(d))}`,`   Sisa: ${money(left)}`,'')});lines.push(`TOTAL TAGIHAN: ${money(sum)}`,'','Mohon bantuannya untuk melakukan pelunasan, Kak. Jika sudah membayar, mohon kabari kami agar catatan tagihan segera kami perbarui. Terima kasih banyak, Kak. 🙏');return lines.join('\n')}
function render(){const rows=filterData(),sum=rows.reduce((a,d)=>a+sisa(d),0),count=new Set(rows.map(d=>normPhone(phone(d))||name(d).toLowerCase())).size;$('summary').innerHTML=`📋 <b>${rows.length} nota tagihan</b><br>👥 <b>${count} pelanggan</b><br>💰 Total sisa tagihan: <b>${money(sum)}</b>`;const groups=new Map();rows.forEach(d=>{const key=normPhone(phone(d))||name(d).trim().toLowerCase();if(!groups.has(key))groups.set(key,{nama:name(d),wa:phone(d),rows:[]});groups.get(key).rows.push(d)});if(!groups.size){$('results').innerHTML='<div class="empty">Tidak ada tagihan pada periode ini.</div>';return}
$('results').innerHTML=[...groups.values()].sort((a,b)=>a.nama.localeCompare(b.nama,'id')).map(p=>{const pSum=p.rows.reduce((a,d)=>a+sisa(d),0),wa=normPhone(p.wa),url=wa?`https://wa.me/${wa}?text=${encodeURIComponent(waMessage(p,p.rows,$('from').value,$('to').value))}`:'';return `<article class="person"><div class="personhead"><div><h3>${esc(p.nama)}</h3><div class="muted">WhatsApp: ${esc(p.wa||'Belum ada nomor WA')} • ${p.rows.length} nota</div></div>${url?`<button class="btn green" onclick="window.open('${url}','_blank','noopener')">📲 Siapkan WA Tagihan</button>`:`<button class="btn dark" disabled>Nomor WA kosong</button>`}</div>${[...p.rows].sort((a,b)=>date(a).localeCompare(date(b))).map(d=>{const id=esc(d.id),nota=esc(d.nomorNota||d.nota||d.id),products=productList(d);return `<div class="sale-row"><div class="sale-top"><div><div class="sale-nota">Nota: ${nota}</div><div class="sale-date">Tanggal: ${esc(fmtDate(date(d)))}</div></div><span class="btn yellow" style="padding:7px 10px;cursor:default">TAGIHAN</span></div><div class="detail-label">Detail Produk</div><div class="product-lines">${products.map((x,j)=>`<div class="product-line"><b>${j+1}.</b> ${esc(x)}</div>`).join('')}</div><div class="money-grid"><div class="money-cell"><span>Total</span><b>${money(Math.max(0,total(d)-diskon(d)))}</b></div><div class="money-cell"><span>DP</span><b>${money(dp(d))}</b></div><div class="money-cell"><span>Sisa</span><b>${money(sisa(d))}</b></div></div><div class="sale-actions"><button class="btn blue" onclick="editTransaction('${id}')">✏️ Edit Transaksi</button><button class="btn green" onclick="markLunas('${id}')">✅ Tandai Lunas</button></div></div>`}).join('')}<div class="total">TOTAL TAGIHAN PELANGGAN: ${money(pSum)}</div></article>`}).join('')}
async function load(){if(!ownerUid)return;$('msg').textContent='Mengambil data penjualan dari Firebase...';$('reloadBtn').disabled=true;try{let snap;try{snap=await getDocsFromServer(query(collection(db,'penjualan'),where('ownerUid','==',ownerUid)))}catch(e){snap=await getDocs(query(collection(db,'penjualan'),where('ownerUid','==',ownerUid)))}all=snap.docs.map(x=>({id:x.id,...x.data()}));$('msg').textContent=`Data penjualan berhasil dimuat: ${all.length} transaksi.`;render()}catch(e){$('results').innerHTML=`<div class="err">Gagal membaca data penjualan: ${esc(e.message||e)}\nPeriksa aturan Firestore dan pastikan data penjualan memiliki field ownerUid yang sesuai.</div>`;$('msg').textContent='Gagal memuat data.';$('summary').textContent='Ringkasan belum tersedia.'}finally{$('reloadBtn').disabled=false}}
function openEdit(id){const d=all.find(x=>x.id===id);if(!d)return;editingId=id;$('edTanggal').value=date(d);$('edNota').value=d.nomorNota||d.nota||'';$('edNama').value=name(d)==='Pelanggan'?'':name(d);$('edWa').value=phone(d);$('edProduk').value=productList(d).join('\n');$('edTotal').value=total(d);$('edDiskon').value=diskon(d);$('edDp').value=dp(d);$('edStatus').value=['tagihan','lunas','tunai','batal'].includes(status(d))?status(d):'tagihan';$('editMsg').textContent='Edit data transaksi ini, lalu tekan Simpan Perubahan.';$('editModal').classList.add('show')}
function closeEdit(){$('editModal').classList.remove('show');editingId=''}
window.editTransaction=openEdit;window.markLunas=async id=>{const d=all.find(x=>x.id===id);if(!d||status(d)!=='tagihan')return;if(!confirm(`Tandai nota ${d.nomorNota||d.nota||id} sebagai LUNAS? Status transaksi akan berubah menjadi Lunas.`))return;try{await updateDoc(doc(db,'penjualan',id),{status:'lunas',sisa:0,pendapatan:Math.max(0,total(d)-diskon(d)),lunasAt:serverTimestamp(),updatedAt:serverTimestamp(),ownerUid:ownerUid,ownerId:ownerUid});$('msg').textContent=`Nota ${d.nomorNota||d.nota||id} berhasil ditandai Lunas.`;await load()}catch(e){alert('Gagal mengubah status menjadi Lunas: '+(e.message||e))}};
$('saveEdit').addEventListener('click',async()=>{if(!editingId)return;const btn=$('saveEdit');btn.disabled=true;$('editMsg').textContent='Menyimpan perubahan...';try{const ref=doc(db,'penjualan',editingId),snap=await getDoc(ref);if(!snap.exists())throw Error('Transaksi tidak ditemukan di Firebase.');const current=snap.data()||{};if(String(current.ownerUid||current.ownerId||'')!==String(ownerUid))throw Error('Transaksi ini bukan milik owner yang sedang aktif.');const nt=Math.max(0,Number($('edTotal').value)||0),dis=Math.max(0,Number($('edDiskon').value)||0),paid=Math.max(0,Number($('edDp').value)||0),st=$('edStatus').value,wa=$('edWa').value.trim(),customer=$('edNama').value.trim()||'Pelanggan',nota=$('edNota').value.trim()||current.nomorNota||current.nota||editingId;let s=st==='tagihan'?Math.max(0,nt-dis-paid):0;const patch={tanggal:$('edTanggal').value||date(current),nomorNota:nota,nota, namaPelanggan:customer,noHp:wa,noWhatsapp:wa,wa,items:$('edProduk').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean),total:nt,diskon:dis,dp:paid,sisa:s,status:st,pendapatan:['lunas','tunai'].includes(st)?Math.max(0,nt-dis):st==='tagihan'?Math.min(paid,Math.max(0,nt-dis)):0,updatedAt:serverTimestamp(),ownerUid,ownerId:ownerUid};if(current.pelanggan&&typeof current.pelanggan==='object')patch.pelanggan={...current.pelanggan,nama:customer,wa};await updateDoc(ref,patch);closeEdit();$('msg').textContent='Perubahan transaksi berhasil disimpan.';await load()}catch(e){$('editMsg').textContent='Gagal menyimpan: '+(e.message||e)}finally{btn.disabled=false}});
$('cancelEdit').addEventListener('click',closeEdit);$('editModal').addEventListener('click',e=>{if(e.target===$('editModal'))closeEdit()});$('filterBtn').addEventListener('click',render);$('search').addEventListener('input',render);$('from').addEventListener('change',render);$('to').addEventListener('change',render);$('reloadBtn').addEventListener('click',load);
onAuthStateChanged(auth,async u=>{if(!u){location.replace('login.html');return}try{uid=u.uid;const us=await getDoc(doc(db,'users',u.uid));if(!us.exists())throw Error('Profil pengguna tidak ditemukan.');const p=us.data()||{},role=String(p.role||'').toLowerCase();ownerUid=(role==='owner'||role==='superadmin'||p.isOwner===true)?u.uid:String(p.ownerUid||'').trim();if(!ownerUid)throw Error('Owner UID tidak ditemukan pada profil akun.');let op=p;if(ownerUid!==uid){const os=await getDoc(doc(db,'users',ownerUid));if(os.exists())op=os.data()||{}}ownerLabel=op.namaOwner||op.ownerName||op.namaKonter||op.namaToko||op.namaUsaha||op.displayName||op.nama||op.name||op.businessName||op.email||'Owner';$('accountLine').textContent=`Owner: ${ownerLabel} • Akun: ${u.email||'pengguna'}`;await load()}catch(e){$('msg').innerHTML=`<span class="err">Gagal memuat akun: ${esc(e.message||e)}</span>`;$('results').innerHTML='';$('summary').textContent='Ringkasan belum tersedia.'}});
</script></body></html>
